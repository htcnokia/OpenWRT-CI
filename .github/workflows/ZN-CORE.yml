# SPDX-License-Identifier: MIT
#云编译公用核心
name: ZN-WRT-CORE
on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_WORD:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        default: false
        type: boolean
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: ${{inputs.WRT_CONFIG}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_SSID: ${{inputs.WRT_SSID}}
  WRT_WORD: ${{inputs.WRT_WORD}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_SOURCE: ${{inputs.WRT_SOURCE}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    outputs:
      cache_prefix: ${{steps.initialize-values.outputs.cache_prefix}}
      cache_key: ${{steps.clone-code.outputs.cache_key}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main
      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt
      - name: Initialization Values
        id: initialize-values
        run: |
          WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' "./Config/$WRT_CONFIG.txt")
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          WRT_CACHE_TARGET="$WRT_TARGET-$WRT_SUBTARGET"
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_CACHE_TARGET"
          {
            #echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_INFO=ZN-M2"
            echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_TARGET=$WRT_TARGET"
            echo "WRT_SUBTARGET=$WRT_SUBTARGET"
            echo "WRT_CACHE_TARGET=$WRT_CACHE_TARGET"
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_WIFI=wifi-yes"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"
          echo "cache_prefix=$WRT_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
      - name: Clone Code
        id: clone-code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/
          cd ./wrt/
          WRT_HASH=$(git rev-parse HEAD)
          echo "WRT_HASH=$WRT_HASH" >> $GITHUB_ENV
          echo "WRT_CACHE_KEY=$WRT_CACHE_PREFIX-$WRT_HASH" >> $GITHUB_ENV
          echo "cache_key=$WRT_CACHE_PREFIX-$WRT_HASH" >> "$GITHUB_OUTPUT"
          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi
      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;
      - name: Restore Build Cache
        id: cache-restore
        if: ${{ !inputs.WRT_TEST }}
        uses: actions/cache/restore@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          restore-keys: ${{env.WRT_CACHE_PREFIX}}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
      - name: Prepare Restored Build Cache
        if: ${{ !inputs.WRT_TEST && steps.cache-restore.outputs.cache-matched-key != '' }}
        run: |
          find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
            find "$DIR" -type f -exec touch {} +
          done
          mkdir -p ./wrt/tmp
          echo "1" > ./wrt/tmp/.build
          echo "restored build cache: ${{steps.cache-restore.outputs.cache-matched-key}}"
      - name: Update Feeds
        run: |
          cd ./wrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Custom Packages
        run: |
          cd ./wrt/
          $GITHUB_WORKSPACE/Scripts/ZN-Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh
          # HomeProxy 自定义处理
          # 必须显式传入 OpenWrt 构建根目录，
          # 避免 ZN-HomeProxy.sh 使用 GITHUB_WORKSPACE
          $GITHUB_WORKSPACE/Scripts/ZN-HomeProxy.sh "$PWD"
          
      - name: Verify HomeProxy Customization
        run: |
          cd ./wrt/
          set -e
          # ============================================================
          # HomeProxy paths
          # ============================================================
          HP_DIR="./package/luci-app-homeproxy"
          HP_ROOT="$HP_DIR/root"
          HP_ETC="$HP_ROOT/etc/homeproxy"
          SRS_DIR="$HP_ETC/private_srs"
          GENERATOR="$HP_ETC/scripts/generate_client.uc"
          MAKEFILE="$HP_DIR/Makefile"
          echo "========================================"
          echo "HomeProxy path configuration"
          echo "========================================"
          echo "HP_DIR    = $HP_DIR"
          echo "HP_ROOT   = $HP_ROOT"
          echo "HP_ETC    = $HP_ETC"
          echo "SRS_DIR   = $SRS_DIR"
          echo "GENERATOR = $GENERATOR"
          echo "MAKEFILE  = $MAKEFILE"
          # ============================================================
          # 1. Selected HomeProxy source
          # ============================================================
          echo
          echo "========================================"
          echo "1. Selected HomeProxy source"
          echo "========================================"
          if [ ! -d "$HP_DIR" ]; then
            echo "ERROR: HomeProxy package NOT FOUND"
            echo "Expected: $HP_DIR"
            exit 1
          fi
          echo "FOUND: $HP_DIR"
          ls -lah "$HP_DIR"
          # ============================================================
          # 2. Private SRS directory
          # ============================================================
          echo
          echo "========================================"
          echo "2. Private SRS directory"
          echo "========================================"
          if [ ! -d "$SRS_DIR" ]; then
            echo "ERROR: private_srs directory NOT FOUND"
            echo "Expected: $SRS_DIR"
            exit 1
          fi
          echo "FOUND: $SRS_DIR"
          ls -lah "$SRS_DIR"
          # ============================================================
          # 3. Required SRS files
          # ============================================================
          echo
          echo "========================================"
          echo "3. Required SRS files"
          echo "========================================"
          EXPECTED_SRS=(
            "geosite-anthropic.srs"
            "geosite-openai.srs"
            "geosite-geolocation-cn.srs"
            "geosite-whatsapp.srs"
            "geosite-google.srs"
            "geosite-zoom.srs"
            "cn.srs"
            "geosite-geolocation-!cn.srs"
          )
          SRS_COUNT=0
          for file in "${EXPECTED_SRS[@]}"; do
            FILE_PATH="$SRS_DIR/$file"
            if [ ! -f "$FILE_PATH" ]; then
              echo "ERROR: missing SRS file:"
              echo "  $FILE_PATH"
              exit 1
            fi
            if [ ! -s "$FILE_PATH" ]; then
              echo "ERROR: empty SRS file:"
              echo "  $FILE_PATH"
              exit 1
            fi
            SIZE=$(wc -c < "$FILE_PATH")
            echo "OK: $file ($SIZE bytes)"
            SRS_COUNT=$((SRS_COUNT + 1))
          done
          echo
          echo "SRS COUNT = $SRS_COUNT"
          if [ "$SRS_COUNT" -ne 8 ]; then
            echo "ERROR: Expected 8 SRS files, got $SRS_COUNT"
            exit 1
          fi
          echo "PASS: all required SRS files are present and non-empty"
          # ============================================================
          # 4. generate_client.uc
          # ============================================================
          echo
          echo "========================================"
          echo "4. generate_client.uc"
          echo "========================================"
          if [ ! -f "$GENERATOR" ]; then
            echo "ERROR: generate_client.uc NOT FOUND"
            echo "Expected: $GENERATOR"
            exit 1
          fi
          echo "FOUND: $GENERATOR"
          ls -lh "$GENERATOR"
          echo
          echo "--- RuleSet related lines ---"
          grep -nE \
            "geoip-cn|geosite-cn|geosite-noncn|private_srs|type: 'local'|type: 'remote'|download_detour|update_interval|url:" \
            "$GENERATOR" || true
          # ============================================================
          # 5. Required local RuleSets
          # ============================================================
          echo
          echo "========================================"
          echo "5. Required local RuleSets"
          echo "========================================"
          for tag in geoip-cn geosite-cn geosite-noncn; do
            if grep -q "tag: '$tag'" "$GENERATOR"; then
              echo "FOUND tag: $tag"
            else
              echo "ERROR: missing tag: $tag"
              exit 1
            fi
          done
          
          echo "PASS: all required RuleSet tags found"
          # ============================================================
          # 6. Local RuleSet configuration
          # ============================================================
          echo
          echo "========================================"
          echo "6. Local RuleSet configuration"
          echo "========================================"
          if grep -q "private_srs" "$GENERATOR"; then
            echo "PASS: private_srs reference found"
          else
            echo "ERROR: private_srs reference NOT found"
            exit 1
          fi
          LOCAL_COUNT=$(grep -c "type: 'local'" "$GENERATOR" || true)
          echo "Local RuleSet definitions: $LOCAL_COUNT"
          if [ "$LOCAL_COUNT" -lt 3 ]; then
            echo "ERROR: Expected at least 3 local RuleSet definitions"
            exit 1
          fi
          
          echo "PASS: local RuleSet configuration detected"
          echo
          echo "========================================"
          echo "7. HomeProxy Makefile"
          echo "========================================"
          if [ ! -f "$MAKEFILE" ]; then
              echo "ERROR: Makefile NOT FOUND"
              exit 1
          fi
          echo "--- Makefile ---"
          cat "$MAKEFILE"
          echo
          echo "--- Makefile checks ---"
          grep -q '^PKG_NAME:=luci-app-homeproxy$' "$MAKEFILE" \
              && echo "PASS: PKG_NAME" \
              || { echo "ERROR: PKG_NAME mismatch"; exit 1; }
          grep -q '^PKG_VERSION:' "$MAKEFILE" \
              && echo "PASS: PKG_VERSION" \
              || { echo "ERROR: PKG_VERSION missing"; exit 1; }
          grep -q '^PKG_RELEASE:' "$MAKEFILE" \
              && echo "PASS: PKG_RELEASE" \
              || { echo "ERROR: PKG_RELEASE missing"; exit 1; }
          grep -q '+sing-box' "$MAKEFILE" \
              && echo "PASS: sing-box dependency" \
              || { echo "ERROR: sing-box dependency missing"; exit 1; }
          grep -q '+firewall4' "$MAKEFILE" \
              && echo "PASS: firewall4 dependency" \
              || { echo "ERROR: firewall4 dependency missing"; exit 1; }
          grep -q 'include $(TOPDIR)/feeds/luci/luci.mk' "$MAKEFILE" \
              && echo "PASS: luci.mk include" \
              || { echo "ERROR: luci.mk include missing"; exit 1; }
          echo
          echo "========================================"
          echo "8. Final result"
          echo "========================================"
          echo "HomeProxy package : $HP_DIR"
          echo "Private SRS       : $SRS_DIR"
          echo "Generator         : $GENERATOR"
          echo "SRS files         : $SRS_COUNT"
          echo
          echo "========================================"
          echo "PASS: HomeProxy source verification completed"
          echo "========================================"
      
      - name: Custom Settings
        run: |
          cd ./wrt/
      
          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt \
                $GITHUB_WORKSPACE/Config/ZN-GENERAL.txt >> .config
          fi
      
          $GITHUB_WORKSPACE/Scripts/ZN-Settings.sh
      
          make defconfig -j$(nproc)
      
          # ZN-M2 有线版：
          # defconfig 完成后最终关闭 Wi-Fi / USB
          $GITHUB_WORKSPACE/Scripts/ZN-FINAL-CONFIG.sh
      
          make clean -j$(nproc)
     
      - name: Download Packages
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make download -j$(nproc)
          
      - name: Compile Firmware
        if: ${{ !inputs.WRT_TEST }}
        run: |
          cd ./wrt/
          make -j$(nproc) || make -j1 V=s
          
      - name: Save Build Cache
        if: ${{ !inputs.WRT_TEST && success() && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            
      - name: Machine Information
        run: |
          cd ./wrt/
          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="
          
      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/
          cp -f ./.config \
            ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          if [[ "$WRT_TEST" != 'true' ]]; then
            echo "========================================"
            echo "Collect HomeProxy APK"
            echo "========================================"
            HOMEProxy_APK=$(find ./bin/targets ./bin/packages \
              -type f \
              -name 'luci-app-homeproxy*.apk' \
              -print \
              2>/dev/null | head -n 1)
            if [ -n "$HOMEProxy_APK" ]; then
              echo "FOUND: $HOMEProxy_APK"
              cp -f "$HOMEProxy_APK" \
                ./upload/luci-app-homeproxy.apk
              echo "Uploaded as:"
              echo "  ./upload/luci-app-homeproxy.apk"
            else
              echo "ERROR: luci-app-homeproxy*.apk NOT FOUND"
              echo
              echo "Available HomeProxy packages:"
              find ./bin/targets ./bin/packages \
                -type f \
                -iname '*homeproxy*' \
                -print \
                2>/dev/null || true
              exit 1
            fi
            echo
            echo "========================================"
            echo "Firmware metadata"
            echo "========================================"
            echo "WRT_KVER=$(find ./bin/targets/ \
              -type f \
              -name "*.manifest" \
              -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" \
              >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ \
              -type f \
              -name "*.manifest" \
              -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; |
              tr '\n' ' ')" \
              >> $GITHUB_ENV
            echo
            echo "========================================"
            echo "Clean target metadata"
            echo "========================================"
            find ./bin/targets/ \
              -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" \
              -exec rm -rf {} +
            echo
            echo "========================================"
            echo "Collect firmware"
            echo "========================================"
            for FILE in $(find ./bin/targets/ \
              -type f \
              -iname "*$WRT_TARGET*"); do
              EXT=$(basename "$FILE" | cut -d '.' -f 2-)
              NAME=$(basename "$FILE" |
                grep -io "\($WRT_TARGET\).*" |
                head -n 1)
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f "$FILE" "./upload/$NEW_FILE"
            done
            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;
            echo
            echo "========================================"
            echo "Upload artifacts"
            echo "========================================"
            ls -lah ./upload/
            make clean -j$(nproc)
          fi
      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            ZN-M2有线主路由固件
            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}
            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}
            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}
            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
  cache-rollover:
    name: Roll cache generations
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
    steps:
      - name: Roll Build Cache
        run: |
          set -euo pipefail
          CURRENT_CACHE_KEYS=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_KEY" --ref "$GITHUB_REF" --limit 100 --json key --jq '.[].key')
          CURRENT_CACHE_FOUND=0
          while IFS= read -r CACHE_KEY; do
            if [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ]; then
              CURRENT_CACHE_FOUND=1
              break
            fi
          done <<< "$CURRENT_CACHE_KEYS"
          if [ "$CURRENT_CACHE_FOUND" -ne 1 ]; then
            echo "skip cache rollover: current cache is not available yet"
            exit 0
          fi
          gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv' |
            while IFS=$'\t' read -r CACHE_ID CACHE_KEY; do
              [ -n "$CACHE_ID" ] || continue
              [ "$CACHE_KEY" = "$WRT_CACHE_KEY" ] && continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "warning: failed to delete cache $CACHE_ID ($CACHE_KEY)"
            done
