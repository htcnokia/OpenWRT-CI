name: Build ZN-M2 Dual Source

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      PACKAGE:
        description: "手动添加插件包，多个包请用换行符分隔。"
        required: false
        default: ""
        type: string

      TEST:
        description: "仅生成并检查配置，不编译固件。"
        required: false
        default: false
        type: boolean

      ENABLE_WIFI:
        description: "手动编译时是否启用 Wi-Fi。自动编译默认关闭。"
        required: false
        default: false
        type: boolean

      ENABLE_USB:
        description: "手动编译时是否启用 USB。自动编译默认关闭。"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zn-m2-dual-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-zn-m2:
    name: ZN-M2 ${{ matrix.name }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include:
          - name: ImmortalWrt-noNSS
            source_id: immortalwrt
            wrt_repo: https://github.com/VIKINGYFY/immortalwrt.git
            wrt_branch: main
            wrt_source: VIKINGYFY/immortalwrt
            enable_nss: "false"

          - name: LibWrt-NSS
            source_id: libwrt
            wrt_repo: https://github.com/LiBwrt/LibWrt.git
            wrt_branch: 25.12-nss
            wrt_source: LiBwrt/LibWrt
            enable_nss: "true"

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      WRT_CONFIG: ZN-M2-WIRED
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.188.1
      WRT_PW: 无

      WRT_REPO: ${{ matrix.wrt_repo }}
      WRT_BRANCH: ${{ matrix.wrt_branch }}
      WRT_SOURCE: ${{ matrix.wrt_source }}
      SOURCE_ID: ${{ matrix.source_id }}
      ENABLE_NSS: ${{ matrix.enable_nss }}

      WRT_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.PACKAGE || '' }}
      WRT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.TEST || false }}

      # 自动触发时固定为 false；手动触发时读取选项
      ENABLE_WIFI: ${{ github.event_name == 'workflow_dispatch' && inputs.ENABLE_WIFI || false }}
      ENABLE_USB: ${{ github.event_name == 'workflow_dispatch' && inputs.ENABLE_USB || false }}

      WRT_TARGET: zn_m2
      SUBWRT_BRANCH: htcnokia

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo -E apt-get -yqq purge firefox || true
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq full-upgrade
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq autoclean
          sudo -E apt-get -yqq clean

          sudo -E apt-get -yqq install \
            dos2unix \
            libfuse-dev \
            libncurses-dev \
            libncurses6

          sudo bash -c \
            'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone Asia/Shanghai

          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt

          if [ -e "$GITHUB_WORKSPACE/wrt" ] || [ -L "$GITHUB_WORKSPACE/wrt" ]; then
            rm -rf "$GITHUB_WORKSPACE/wrt"
          fi

          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          set -e

          WRT_TARGET_FROM_CONFIG="$(
            grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' \
              "./Config/$WRT_CONFIG.txt" || true
          )"

          if [ -z "$WRT_TARGET_FROM_CONFIG" ]; then
            echo "ERROR: unable to determine target from configuration"
            exit 1
          fi

          {
            echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_TARGET=$WRT_TARGET_FROM_CONFIG"
            echo "WRT_WIFI=disabled"
            echo "WRT_USB=disabled"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"

          echo "Source: $WRT_SOURCE"
          echo "Branch: $WRT_BRANCH"
          echo "ENABLE_NSS: $ENABLE_NSS"
          echo "ENABLE_WIFI: $ENABLE_WIFI"
          echo "ENABLE_USB: $ENABLE_USB"
          echo "WRT_TEST: $WRT_TEST"

      - name: Clone Code
        run: |
          set -e

          rm -rf ./wrt

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt

          cd ./wrt

          WRT_HASH="$(git rev-parse HEAD)"
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo "Using source commit: $WRT_HASH"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          set -e

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex '.*\(txt\|sh\)$' \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      - name: Update Feeds
        run: |
          set -e

          cd ./wrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          set -e

          cd ./wrt/package

          rm -rf openwrt-bandix luci-app-bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            openwrt-bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            luci-app-bandix

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Fix Sing-Box Dependency
        run: |
          set -e

          cd ./wrt

          rm -rf ./build_dir/target-*/sing-box-*
          rm -f ./staging_dir/target-*/pkginfo/sing-box*.default

      - name: Prepare Base Configuration
        run: |
          set -e

          cd ./wrt

          # 写入基础配置
          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config

          # 读取基础配置并应用自定义设置
          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          # 第一次让 Kconfig 解析基础依赖
          make defconfig

      - name: Configure Wi-Fi USB NSS
        run: |
          set -e

          cd ./wrt

          set_config() {
            key="$1"
            value="$2"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "${key}=${value}" >> .config
          }

          unset_config() {
            key="$1"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "# ${key} is not set" >> .config
          }

          config_exists() {
            key="$1"

            grep -Rqs \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+${key#CONFIG_}([[:space:]]|$)" \
              package target feeds 2>/dev/null
          }

          package_config_exists() {
            key="${1#CONFIG_PACKAGE_}"

            grep -Rqs \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+${key}([[:space:]]|$)" \
              package target feeds 2>/dev/null
          }

          echo "===== APPLY FEATURE CONFIGURATION ====="
          echo "Source: $WRT_SOURCE"
          echo "ENABLE_NSS: $ENABLE_NSS"
          echo "ENABLE_WIFI: $ENABLE_WIFI"
          echo "ENABLE_USB: $ENABLE_USB"

          # 无线开关
          if [ "$ENABLE_WIFI" = "true" ]; then
            echo "Wi-Fi enabled."
            set_config CONFIG_ATH11K_MEM_PROFILE_512M y

            if config_exists ATH11K_NSS_MESH_SUPPORT; then
              set_config CONFIG_ATH11K_NSS_MESH_SUPPORT y
            fi
          else
            echo "Wi-Fi disabled."

            unset_config CONFIG_ATH11K_NSS_MESH_SUPPORT
            unset_config CONFIG_PACKAGE_iw
            unset_config CONFIG_PACKAGE_wireless_regdb
            unset_config CONFIG_PACKAGE_wpad
            unset_config CONFIG_PACKAGE_wpad_openssl
            unset_config CONFIG_PACKAGE_wpa_supplicant
          fi

          # USB 开关
          if [ "$ENABLE_USB" = "true" ]; then
            echo "USB enabled."
            set_config CONFIG_PACKAGE_kmod-usb-core y
            set_config CONFIG_PACKAGE_kmod-usb2 y
            set_config CONFIG_PACKAGE_kmod-usb3 y
            set_config CONFIG_PACKAGE_usbutils y
          else
            echo "USB disabled."

            unset_config CONFIG_PACKAGE_kmod-usb-core
            unset_config CONFIG_PACKAGE_kmod-usb2
            unset_config CONFIG_PACKAGE_kmod-usb3
            unset_config CONFIG_PACKAGE_usbutils
            unset_config CONFIG_PACKAGE_kmod-usb-storage
            unset_config CONFIG_PACKAGE_block-mount
            unset_config CONFIG_PACKAGE_kmod-fs-ext4
            unset_config CONFIG_PACKAGE_kmod-fs-vfat
            unset_config CONFIG_PACKAGE_kmod-fs-ntfs3
          fi

          # NSS 开关：LibWrt 开启，旧 ImmortalWrt 关闭
          if [ "$ENABLE_NSS" = "true" ]; then
            echo "NSS acceleration enabled."

            if config_exists NSS_FIRMWARE_VERSION_11_4; then
              set_config CONFIG_NSS_FIRMWARE_VERSION_11_4 y
            fi

            if [ "$ENABLE_WIFI" = "true" ] && config_exists ATH11K_NSS_MESH_SUPPORT; then
              set_config CONFIG_ATH11K_NSS_MESH_SUPPORT y
            else
              unset_config CONFIG_ATH11K_NSS_MESH_SUPPORT
            fi

            for key in \
              CONFIG_PACKAGE_kmod-qca-nss-drv \
              CONFIG_PACKAGE_kmod-qca-nss-dp \
              CONFIG_PACKAGE_kmod-qca-nss-clients \
              CONFIG_PACKAGE_kmod-qca-nss-ecm \
              CONFIG_PACKAGE_kmod-qca-ssdk
            do
              if package_config_exists "$key"; then
                set_config "$key" y
              fi
            done

            # RMNET/蜂窝 modem 始终关闭
            unset_config CONFIG_PACKAGE_kmod-qca-nss-rmnet
            unset_config CONFIG_PACKAGE_kmod-rmnet

            # 让 LibWrt 补齐依赖
            make defconfig

            # 依赖解析后再次关闭 RMNET
            unset_config CONFIG_PACKAGE_kmod-qca-nss-rmnet
            unset_config CONFIG_PACKAGE_kmod-rmnet

          else
            echo "NSS acceleration disabled."

            for key in \
              CONFIG_PACKAGE_kmod-qca-nss-crypto \
              CONFIG_PACKAGE_kmod-qca-nss-dp \
              CONFIG_PACKAGE_kmod-qca-nss-drv \
              CONFIG_PACKAGE_kmod-qca-nss-ecm \
              CONFIG_PACKAGE_kmod-qca-nss-rmnet \
              CONFIG_PACKAGE_kmod-qca-nss-clients \
              CONFIG_PACKAGE_kmod-qca-nss-phy \
              CONFIG_PACKAGE_kmod-qca-ssdk \
              CONFIG_PACKAGE_qca-ssdk \
              CONFIG_PACKAGE_nss-firmware \
              CONFIG_PACKAGE_nss-ifb
            do
              unset_config "$key"
            done
          fi

          # 最终标记
          if [ "$ENABLE_WIFI" = "true" ]; then
            export WRT_WIFI=enabled
            echo "WRT_WIFI=enabled" >> "$GITHUB_ENV"
          else
            export WRT_WIFI=disabled
            echo "WRT_WIFI=disabled" >> "$GITHUB_ENV"
          fi

          if [ "$ENABLE_USB" = "true" ]; then
            export WRT_USB=enabled
            echo "WRT_USB=enabled" >> "$GITHUB_ENV"
          else
            export WRT_USB=disabled
            echo "WRT_USB=disabled" >> "$GITHUB_ENV"
          fi

          echo "===== CONFIG AFTER FEATURE CONFIGURATION ====="
          grep -nEi \
            'qca-nss|qca-ssdk|rmnet|NSS_FIRMWARE|ATH11K|usb|wireless|wpad' \
            .config || true

      - name: Verify Final Configuration
        run: |
          set -e

          cd ./wrt

          echo "===== FINAL CONFIGURATION CHECK ====="

          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-rmnet=[ym]' .config; then
            echo "ERROR: RMNET/NSS RMNET is enabled."
            exit 1
          fi

          if [ "$ENABLE_NSS" = "false" ]; then
            NSS_ENABLED_LINES="$(
              grep -E \
                '^CONFIG_PACKAGE_(kmod-qca-nss-|kmod-qca-ssdk|qca-ssdk|nss-)' \
                .config || true
            )"

            if [ -n "$NSS_ENABLED_LINES" ]; then
              echo "ERROR: NSS packages remain enabled:"
              echo "$NSS_ENABLED_LINES"
              exit 1
            fi
          fi

          if [ "$ENABLE_WIFI" = "false" ]; then
            if grep -qE \
              '^CONFIG_PACKAGE_(iw|wireless-regdb|wpad|wpad-openssl|wpa-supplicant)=[ym]' \
              .config
            then
              echo "ERROR: Wi-Fi userspace packages remain enabled."
              exit 1
            fi
          fi

          if [ "$ENABLE_USB" = "false" ]; then
            if grep -qE \
              '^CONFIG_PACKAGE_(kmod-usb-core|kmod-usb2|kmod-usb3|usbutils|kmod-usb-storage)=[ym]' \
              .config
            then
              echo "ERROR: USB packages remain enabled."
              exit 1
            fi
          fi

          echo "Configuration verification passed."

      - name: Diagnose NSS Selectors
        if: failure()
        run: |
          cd ./wrt

          echo "===== NSS SELECTOR DIAGNOSTICS ====="

          grep -RniE \
            'qca-nss-ecm|kmod-qca-nss-ecm|nss_rmnet_rx_get_ifnum' \
            package target feeds 2>/dev/null \
            | head -300 || true

      - name: Clean Stale Build State
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt

          rm -rf build_dir/target-*/linux-*/qca-nss-*
          rm -rf build_dir/target-*/linux-*/qca-ssdk-*

          find staging_dir/target-* \
            -type f \
            \( \
              -iname '*qca-nss*' \
              -o -iname '*qca-ssdk*' \
              -o -iname '*rmnet*' \
            \) \
            -delete 2>/dev/null || true

          rm -f tmp/.packageinfo
          rm -f tmp/.targetinfo

          echo "Stale NSS/SSDK state cleaned."

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt
          make download -j"$(nproc)"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt

          make -j"$(nproc)" || make -j1 V=s

      - name: Package Firmware
        run: |
          set -e

          cd ./wrt

          mkdir -p upload

          cp -f \
            ./.config \
            "./upload/Config-${WRT_CONFIG}-${SOURCE_ID}-${WRT_BRANCH}-${ENABLE_NSS}-${WRT_WIFI}-${WRT_USB}-${WRT_DATE}.txt"

          if [ "$WRT_TEST" != "true" ]; then
            MANIFEST_FILE="$(
              find ./bin/targets/ \
                -type f \
                -name '*.manifest' \
                -print -quit
            )"

            if [ -n "$MANIFEST_FILE" ]; then
              WRT_KVER="$(
                grep -oP '^kernel - \K[\d.]+' "$MANIFEST_FILE" \
                | head -n 1 || true
              )"

              WRT_LIST="$(
                grep -oP '^luci-(app|theme)[^ ]*' "$MANIFEST_FILE" \
                | tr '\n' ' ' || true
              )"

              echo "WRT_KVER=$WRT_KVER" >> "$GITHUB_ENV"
              echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"
            fi

            find ./bin/targets/ \
              -type f \
              \( \
                -name '*buildinfo*' \
                -o -name '*.json' \
                -o -name 'sha256sums' \
              \) \
              -delete

            find ./bin/targets/ \
              -type d \
              -name packages \
              -prune \
              -exec rm -rf {} +

            while IFS= read -r -d '' FILE; do
              EXT="${FILE##*.}"
              BASE="$(basename "$FILE")"
              NAME="${BASE%%.*}"

              NEW_FILE="${NAME}-${SOURCE_ID}-${WRT_BRANCH}-${ENABLE_NSS}-${WRT_WIFI}-${WRT_USB}-${WRT_DATE}.${EXT}"

              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0
            )

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

            make clean -j"$(nproc)" || true
          fi

      - name: Release Firmware
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ZN-M2-${{ matrix.source_id }}-${{ env.ENABLE_NSS }}-${{ env.WRT_WIFI }}-${{ env.WRT_USB }}-${{ env.WRT_DATE }}
          name: ZN-M2 ${{ matrix.name }} ${{ env.WRT_DATE }}
          files: ./wrt/upload/*.* 
          body: |
            这是为 ZN-M2 设计的固件。

            构建类型：${{ matrix.name }}
            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            NSS 加速：${{ env.ENABLE_NSS }}
            Wi-Fi：${{ env.WRT_WIFI }}
            USB：${{ env.WRT_USB }}
            RMNET/蜂窝 modem：始终禁用

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2-${{ matrix.source_id }}-${{ env.ENABLE_NSS }}-${{ env.WRT_WIFI }}-${{ env.WRT_USB }}
          path: ./wrt/upload/*
          if-no-files-found: warn
