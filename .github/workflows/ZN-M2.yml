name: Build Perfect ZN-M2 (Wired Router)

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      PACKAGE:
        description: "手动调整插件包，多个请用换行符隔开。"
        required: false
        default: ""
        type: string

      TEST:
        description: "仅输出配置文件，不编译固件。"
        required: false
        default: false
        type: boolean

      ENABLE_NSS:
        description: "是否启用 Qualcomm NSS 加速。RMNET/蜂窝 modem 始终禁用。"
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  build-zn-m2:
    name: ZN-M2 Wired Config
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      WRT_CONFIG: ZN-M2-WIRED
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.188.1
      WRT_PW: 无

      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt

      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_TEST: ${{ inputs.TEST || false }}
      ENABLE_NSS: ${{ inputs.ENABLE_NSS || false }}

      WRT_TARGET: zn_m2
      SUBWRT_BRANCH: htcnokia

    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean

          sudo -E apt -yqq install \
            dos2unix \
            libfuse-dev \
            libncurses-dev \
            libncurses6

          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt

          if [ -e "$GITHUB_WORKSPACE/wrt" ] || [ -L "$GITHUB_WORKSPACE/wrt" ]; then
            rm -rf "$GITHUB_WORKSPACE/wrt"
          fi

          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          set -e

          WRT_TARGET_FROM_CONFIG="$(
            grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' \
              "./Config/$WRT_CONFIG.txt"
          )"

          if [ -z "$WRT_TARGET_FROM_CONFIG" ]; then
            echo "ERROR: unable to determine target from configuration"
            exit 1
          fi

          {
            echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_TARGET=$WRT_TARGET_FROM_CONFIG"
            echo "WRT_WIFI=wired-only"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"

          echo "ENABLE_NSS=$ENABLE_NSS"
          echo "WRT_TEST=$WRT_TEST"

      - name: Clone Code
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/

          cd ./wrt/

          WRT_HASH="$(git rev-parse HEAD)"
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo "Using source commit: $WRT_HASH"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          set -e

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex '.*\(txt\|sh\)$' \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      - name: Check Caches
        if: false
        id: check-cache
        uses: actions/cache@main
        with:
          key: zn-m2-nss-${{ env.ENABLE_NSS }}-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}
          restore-keys: |
            zn-m2-nss-${{ env.ENABLE_NSS }}-${{ env.WRT_INFO }}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: false
        run: |
          echo "Build cache is disabled during NSS diagnosis."

      - name: Update Feeds
        run: |
          set -e

          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          set -e

          cd ./wrt/package/

          rm -rf openwrt-bandix
          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            openwrt-bandix

          rm -rf luci-app-bandix
          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            luci-app-bandix

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Fix Sing-Box Dependency
        run: |
          set -e

          cd ./wrt/

          rm -rf ./build_dir/target-*/sing-box-*
          rm -f ./staging_dir/target-*/pkginfo/sing-box*.default

      - name: Custom Settings
        run: |
          set -e

          cd ./wrt/

          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          make defconfig

      - name: Configure NSS Acceleration
        run: |
          set -e

          cd ./wrt/

          echo "===== NSS CONFIG BEFORE OVERRIDE ====="
          grep -nEi 'qca-nss|rmnet|ecm' .config || true

          sed -i \
            -e '/^CONFIG_PACKAGE_kmod-qca-nss-ecm=/d' \
            -e '/^# CONFIG_PACKAGE_kmod-qca-nss-ecm is not set$/d' \
            -e '/^CONFIG_PACKAGE_kmod-qca-nss-drv=/d' \
            -e '/^# CONFIG_PACKAGE_kmod-qca-nss-drv is not set$/d' \
            -e '/^CONFIG_PACKAGE_kmod-qca-nss-rmnet=/d' \
            -e '/^# CONFIG_PACKAGE_kmod-qca-nss-rmnet is not set$/d' \
            .config

          if [ "$ENABLE_NSS" = "true" ]; then
            echo "NSS acceleration requested."

            printf '%s\n' \
              'CONFIG_PACKAGE_kmod-qca-nss-drv=y' \
              'CONFIG_PACKAGE_kmod-qca-nss-ecm=y' \
              '# CONFIG_PACKAGE_kmod-qca-nss-rmnet is not set' \
              '# CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr is not set' \              
              >> .config

            make defconfig

            if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-rmnet=[ym]' .config; then
              echo "ERROR: qca-nss-rmnet is enabled."
              exit 1
            fi
          else
            echo "NSS acceleration disabled."

            printf '%s\n' \
              '# CONFIG_PACKAGE_kmod-qca-nss-drv is not set' \
              '# CONFIG_PACKAGE_kmod-qca-nss-ecm is not set' \
              '# CONFIG_PACKAGE_kmod-qca-nss-rmnet is not set' \
              '# CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr is not set' \              
              >> .config

            echo "NSS remains disabled without a second make defconfig."

            if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-(drv|ecm|rmnet)=[ym]' .config; then
              echo "ERROR: NSS or RMNET is still enabled."
              exit 1
            fi
          fi

          echo "===== NSS CONFIG AFTER OVERRIDE ====="
          grep -nEi 'qca-nss|rmnet|ecm' .config || true

      - name: Diagnose NSS Selectors
        if: failure()
        run: |
          cd ./wrt/

          echo "===== NSS SELECTOR DIAGNOSTICS ====="

          grep -RniE \
            'qca-nss-ecm|kmod-qca-nss-ecm|nss_rmnet_rx_get_ifnum' \
            package target feeds 2>/dev/null | head -300 || true

      - name: Clean Stale NSS Build State
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/

          rm -rf build_dir/target-*/linux-*/qca-nss-ecm-*
          rm -f tmp/.packageinfo
          rm -f tmp/.targetinfo

          find staging_dir/target-* \
            -type f \
            \( -iname '*qca-nss*' -o -iname '*rmnet*' \) \
            -delete 2>/dev/null || true

          echo "Stale NSS build state cleaned."

      - name: Verify Final Configuration
        run: |
          set -e

          cd ./wrt/

          echo "===== FINAL CONFIGURATION CHECK ====="

          if [ ! -f .config ]; then
            echo "ERROR: .config does not exist"
            exit 1
          fi

          grep -nEi 'qca-nss|rmnet|ecm' .config || true

          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-rmnet=[ym]' .config; then
            echo "ERROR: qca-nss-rmnet is enabled."
            exit 1
          fi

          if [ "$ENABLE_NSS" = "true" ]; then
            grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-drv=[ym]' .config
            grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-ecm=[ym]' .config
            echo "NSS driver and ECM are enabled."
          else
            if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-(drv|ecm)=[ym]' .config; then
              echo "ERROR: NSS components are enabled while ENABLE_NSS=false."
              exit 1
            fi

            echo "NSS acceleration is disabled."
          fi

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/
          make download -j"$(nproc)"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/

          make -j"$(nproc)" || make -j1 V=s

      - name: Package Firmware
        run: |
          set -e

          cd ./wrt/

          mkdir -p ./upload/

          cp -f \
            ./.config \
            "./upload/Config-$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_DATE.txt"

          if [ "$WRT_TEST" != "true" ]; then
            MANIFEST_FILE="$(
              find ./bin/targets/ \
                -type f \
                -name '*.manifest' \
                -print -quit
            )"

            if [ -n "$MANIFEST_FILE" ]; then
              WRT_KVER="$(
                grep -oP '^kernel - \K[\d.]+' "$MANIFEST_FILE" \
                | head -n 1
              )"

              WRT_LIST="$(
                grep -oP '^luci-(app|theme)[^ ]*' "$MANIFEST_FILE" \
                | tr '\n' ' '
              )"

              echo "WRT_KVER=$WRT_KVER" >> "$GITHUB_ENV"
              echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"
            fi

            find ./bin/targets/ \
              -type f \
              \( \
                -name '*buildinfo*' \
                -o -name '*.json' \
                -o -name 'sha256sums' \
              \) \
              -delete

            find ./bin/targets/ \
              -type d \
              -name 'packages' \
              -prune \
              -exec rm -rf {} +

            while IFS= read -r -d '' FILE; do
              EXT="${FILE##*.}"
              BASE="$(basename "$FILE")"
              NAME="${BASE%%.*}"

              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"

              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0
            )

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

            make clean -j"$(nproc)"
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ZN-M2-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.SUBWRT_BRANCH }}-${{ env.ENABLE_NSS }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            这是为 ZN-M2 设计的专属有线主路由固件。

            NSS 加速开关：${{ env.ENABLE_NSS }}
            RMNET/蜂窝 modem：始终禁用

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}
