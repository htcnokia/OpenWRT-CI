name: Build Perfect ZN-M2 (Wired Router)

on:
  # 自动编译：当 Auto-Clean 成功运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  # 手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: "手动调整插件包，多个请用换行符隔开。"
        required: false
        default: ""
        type: string

      TEST:
        description: "仅输出配置文件，不编译固件。"
        required: false
        default: false
        type: boolean

permissions: write-all

jobs:
  build-zn-m2:
    name: ZN-M2 Wired Config
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      WRT_CONFIG: ZN-M2-WIRED
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.188.1
      WRT_PW: 无

      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: main
      WRT_SOURCE: VIKINGYFY/immortalwrt

      WRT_PACKAGE: ${{ inputs.PACKAGE || '' }}
      WRT_TEST: ${{ inputs.TEST || false }}

      WRT_TARGET: zn_m2
      subWRT_BRANCH: htcnokia

    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean

          sudo -E apt -yqq install \
            dos2unix \
            libfuse-dev \
            libncurses-dev \
            libncurses6

          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt

          if [ -e "$GITHUB_WORKSPACE/wrt" ] || [ -L "$GITHUB_WORKSPACE/wrt" ]; then
            rm -rf "$GITHUB_WORKSPACE/wrt"
          fi

          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        run: |
          set -e

          WRT_TARGET_FROM_CONFIG="$(
            grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' \
              "./Config/$WRT_CONFIG.txt"
          )"

          if [ -z "$WRT_TARGET_FROM_CONFIG" ]; then
            echo "ERROR: unable to determine WRT_TARGET from configuration"
            exit 1
          fi

          {
            echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_TARGET=$WRT_TARGET_FROM_CONFIG"
            echo "WRT_WIFI=wired-only"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"

      - name: Clone Code
        run: |
          set -e

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt/

          cd ./wrt/

          WRT_HASH="$(git rev-parse HEAD)"
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo "Using source commit: $WRT_HASH"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        run: |
          set -e

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex '.*\(txt\|sh\)$' \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      # 第一次排查 NSS/ECM 时关闭缓存，避免旧状态影响结果。
      # 确认编译成功后，可以删除 if: false 并恢复缓存。
      - name: Check Caches
        if: false
        id: check-cache
        uses: actions/cache@main
        with:
          key: zn-m2-nss-fix-1-${{ env.WRT_INFO }}-${{ env.WRT_HASH }}
          restore-keys: |
            zn-m2-nss-fix-1-${{ env.WRT_INFO }}-
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: false
        run: |
          echo "Build cache is disabled during NSS diagnosis."

      - name: Update Feeds
        run: |
          set -e

          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          set -e

          cd ./wrt/package/

          # 自动拉取 Bandix 后端核心服务
          rm -rf openwrt-bandix
          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            openwrt-bandix

          # 自动拉取 Bandix 前台 LuCI 界面
          rm -rf luci-app-bandix
          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            luci-app-bandix

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Fix Sing-Box Dependency
        run: |
          set -e

          cd ./wrt/

          # 清理 sing-box 编译缓存与旧包状态
          rm -rf ./build_dir/target-*/sing-box-*
          rm -f ./staging_dir/target-*/pkginfo/sing-box*.default

      - name: Custom Settings
        run: |
          set -e

          cd ./wrt/

          # 仅应用 ZN-M2-WIRED 独立配置
          cat "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" >> .config

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          # 解析配置和依赖
          make defconfig

      - name: Check and Disable NSS Components
        run: |
          set -e

          cd ./wrt/

          echo "===== NSS CONFIG BEFORE FIX ====="
          grep -nEi 'qca-nss|rmnet|ecm' .config || true

          # 删除已有值，避免同一配置同时出现 y、m、n 或重复定义
          sed -i \
            -e '/^CONFIG_PACKAGE_kmod-qca-nss-ecm=/d' \
            -e '/^CONFIG_PACKAGE_kmod-qca-nss-rmnet=/d' \
            .config

          # 不使用 heredoc，避免复制时破坏 YAML 缩进
          printf '%s\n' \
            '# CONFIG_PACKAGE_kmod-qca-nss-ecm is not set' \
            '# CONFIG_PACKAGE_kmod-qca-nss-rmnet is not set' \
            >> .config

          # 重新解析配置
          make defconfig

          echo "===== NSS CONFIG AFTER FIX ====="
          grep -nEi 'qca-nss|rmnet|ecm' .config || true

          # 如果 defconfig 重新启用了 ECM/RMNET，立即停止
          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-(ecm|rmnet)=([ym])' .config; then
            echo "ERROR: qca-nss-ecm or qca-nss-rmnet is still enabled"
            exit 1
          fi

          echo "qca-nss-ecm and qca-nss-rmnet are disabled."

      - name: Diagnose NSS Selectors
        if: failure()
        run: |
          cd ./wrt/

          echo "===== NSS SELECTOR DIAGNOSTICS ====="

          grep -RniE \
            'qca-nss-ecm|kmod-qca-nss-ecm|nss_rmnet_rx_get_ifnum' \
            package target feeds 2>/dev/null | head -300 || true

      - name: Clean Stale NSS Build State
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/

          # 清理可能残留的 ECM 构建状态
          rm -rf build_dir/target-*/linux-*/qca-nss-ecm-*
          rm -f tmp/.packageinfo
          rm -f tmp/.targetinfo

          # 清理可能残留的 ECM/RMNET 包状态
          find staging_dir/target-* \
            -type f \
            \( -iname '*qca-nss*' -o -iname '*rmnet*' \) \
            -delete 2>/dev/null || true

          echo "Stale NSS build state cleaned."

      - name: Verify Final Configuration
        run: |
          set -e

          cd ./wrt/

          echo "===== FINAL CONFIGURATION CHECK ====="

          if [ ! -f .config ]; then
            echo "ERROR: .config does not exist"
            exit 1
          fi

          grep -nEi 'qca-nss|rmnet|ecm' .config || true

          if grep -qE '^CONFIG_PACKAGE_kmod-qca-nss-(ecm|rmnet)=([ym])' .config; then
            echo "ERROR: forbidden NSS component is enabled"
            exit 1
          fi

          echo "Final NSS configuration check passed."

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/
          make download -j"$(nproc)"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          set -e

          cd ./wrt/

          make -j"$(nproc)" || make -j1 V=s

      - name: Package Firmware
        run: |
          set -e

          cd ./wrt/

          mkdir -p ./upload/

          cp -f \
            ./.config \
            "./upload/Config-$WRT_CONFIG-$WRT_INFO-$WRT_BRANCH-$WRT_DATE.txt"

          if [ "$WRT_TEST" != "true" ]; then
            MANIFEST_FILE="$(
              find ./bin/targets/ \
                -type f \
                -name '*.manifest' \
                -print -quit
            )"

            if [ -n "$MANIFEST_FILE" ]; then
              WRT_KVER="$(
                grep -oP '^kernel - \K[\d.]+' "$MANIFEST_FILE" \
                | head -n 1
              )"

              WRT_LIST="$(
                grep -oP '^luci-(app|theme)[^ ]*' "$MANIFEST_FILE" \
                | tr '\n' ' '
              )"

              echo "WRT_KVER=$WRT_KVER" >> "$GITHUB_ENV"
              echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"
            fi

            # 删除索引、校验和及软件包目录，只保留固件文件
            find ./bin/targets/ \
              -type f \
              \( \
                -name '*buildinfo*' \
                -o -name '*.json' \
                -o -name 'sha256sums' \
              \) \
              -delete

            find ./bin/targets/ \
              -type d \
              -name 'packages' \
              -prune \
              -exec rm -rf {} +

            # 优先重命名并移动包含目标名称的固件
            while IFS= read -r -d '' FILE; do
              EXT="${FILE##*.}"
              BASE="$(basename "$FILE")"
              NAME="${BASE%%.*}"

              NEW_FILE="${NAME}-${WRT_INFO}-${WRT_BRANCH}-${WRT_WIFI}-${WRT_DATE}.${EXT}"

              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0
            )

            # 移动剩余固件文件
            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

            # 发布文件已经复制完成，最后再清理构建目录
            make clean -j"$(nproc)"
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ZN-M2-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.subWRT_BRANCH }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            这是为 ZN-M2 量身打造的专属精简有线版固件！
            完全去除了不需要的臃肿组件与无线配置。

            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置：${{ env.WRT_CONFIG }}
            平台：${{ env.WRT_TARGET }}

            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}
