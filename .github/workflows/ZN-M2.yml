name: Build ZN-M2 Dual Source

on:
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      PACKAGE:
        description: "手动添加插件包，多个包请使用换行符分隔。"
        required: false
        default: ""
        type: string

      TEST:
        description: "仅生成并检查配置，不编译固件。"
        required: false
        default: false
        type: boolean

      IMMORTALWRT_ENABLE_NSS:
        description: "ImmortalWrt main 是否启用 NSS。默认关闭，实验性选项。"
        required: false
        default: false
        type: boolean

      LIBWRT_ENABLE_NSS:
        description: "LibWrt 25.12-nss 是否启用有线 NSS。默认开启。"
        required: false
        default: true
        type: boolean

      ENABLE_WIFI:
        description: "是否启用 Wi-Fi。自动流程默认关闭。"
        required: false
        default: false
        type: boolean

      ENABLE_USB:
        description: "是否启用 USB。自动流程默认关闭。"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: zn-m2-dual-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-zn-m2:
    name: ZN-M2 ${{ matrix.name }}

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        include:
          - name: ImmortalWrt-main
            source_id: immortalwrt
            wrt_repo: https://github.com/VIKINGYFY/immortalwrt.git
            wrt_branch: main
            wrt_source: VIKINGYFY/immortalwrt
            config_file: Config/ZN-M2-IMMORTALWRT.txt

          - name: LibWrt-25.12-nss
            source_id: libwrt
            wrt_repo: https://github.com/LiBwrt/LibWrt.git
            wrt_branch: 25.12-nss
            wrt_source: LiBwrt/LibWrt
            config_file: Config/ZN-M2-LIBWRT.txt

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      WRT_REPO: ${{ matrix.wrt_repo }}
      WRT_BRANCH: ${{ matrix.wrt_branch }}
      WRT_SOURCE: ${{ matrix.wrt_source }}
      SOURCE_ID: ${{ matrix.source_id }}
      SOURCE_CONFIG: ${{ matrix.config_file }}

      WRT_TARGET: zn_m2
      SUBWRT_BRANCH: htcnokia
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: 12345678
      WRT_IP: 192.168.188.1
      WRT_PW: 无

      WRT_PACKAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.PACKAGE || '' }}
      WRT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.TEST || false }}

      # 第三方 Actions 仍可能使用 Node 20；这是临时兼容设置。
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout Projects
        uses: actions/checkout@v4

      - name: Initialize Source Options
        shell: bash
        run: |
          set -e

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$SOURCE_ID" = "immortalwrt" ]; then
              SOURCE_ENABLE_NSS="${{ inputs.IMMORTALWRT_ENABLE_NSS }}"
            elif [ "$SOURCE_ID" = "libwrt" ]; then
              SOURCE_ENABLE_NSS="${{ inputs.LIBWRT_ENABLE_NSS }}"
            else
              echo "ERROR: unknown source: $SOURCE_ID"
              exit 1
            fi

            ENABLE_WIFI_INPUT="${{ inputs.ENABLE_WIFI }}"
            ENABLE_USB_INPUT="${{ inputs.ENABLE_USB }}"
          else
            # 自动流程默认：
            # ImmortalWrt：NSS 关闭
            # LibWrt：NSS 开启
            # Wi-Fi：关闭
            # USB：关闭
            if [ "$SOURCE_ID" = "immortalwrt" ]; then
              SOURCE_ENABLE_NSS="false"
            elif [ "$SOURCE_ID" = "libwrt" ]; then
              SOURCE_ENABLE_NSS="true"
            else
              echo "ERROR: unknown source: $SOURCE_ID"
              exit 1
            fi

            ENABLE_WIFI_INPUT="false"
            ENABLE_USB_INPUT="false"
          fi

          echo "SOURCE_ENABLE_NSS=$SOURCE_ENABLE_NSS" >> "$GITHUB_ENV"
          echo "ENABLE_WIFI=$ENABLE_WIFI_INPUT" >> "$GITHUB_ENV"
          echo "ENABLE_USB=$ENABLE_USB_INPUT" >> "$GITHUB_ENV"

          echo "Source: $WRT_SOURCE"
          echo "Branch: $WRT_BRANCH"
          echo "Config: $SOURCE_CONFIG"
          echo "SOURCE_ENABLE_NSS=$SOURCE_ENABLE_NSS"
          echo "ENABLE_WIFI=$ENABLE_WIFI_INPUT"
          echo "ENABLE_USB=$ENABLE_USB_INPUT"

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -e

          sudo -E apt-get -yqq purge firefox || true
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq full-upgrade
          sudo -E apt-get -yqq autoremove --purge
          sudo -E apt-get -yqq autoclean
          sudo -E apt-get -yqq clean

          sudo -E apt-get -yqq install \
            dos2unix \
            libfuse-dev \
            libncurses-dev \
            libncurses6

          sudo bash -c \
            'bash <(curl -fsSL https://build-scripts.immortalwrt.org/init_build_environment.sh)'

          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone Asia/Shanghai

          sudo mkdir -p /mnt/build_wrt
          sudo chown "$USER:$USER" /mnt/build_wrt

          if [ -e "$GITHUB_WORKSPACE/wrt" ] || \
             [ -L "$GITHUB_WORKSPACE/wrt" ]; then
            rm -rf "$GITHUB_WORKSPACE/wrt"
          fi

          ln -s /mnt/build_wrt "$GITHUB_WORKSPACE/wrt"

      - name: Initialization Values
        shell: bash
        run: |
          set -e

          if [ ! -f "$GITHUB_WORKSPACE/$SOURCE_CONFIG" ]; then
            echo "ERROR: configuration file not found:"
            echo "$GITHUB_WORKSPACE/$SOURCE_CONFIG"
            exit 1
          fi

          WRT_TARGET_FROM_CONFIG="$(
            grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?==y)' \
              "$GITHUB_WORKSPACE/$SOURCE_CONFIG" || true
          )"

          if [ -z "$WRT_TARGET_FROM_CONFIG" ]; then
            echo "ERROR: unable to determine target from configuration"
            exit 1
          fi

          if [ "$ENABLE_WIFI" = "true" ]; then
            WRT_WIFI="enabled"
          else
            WRT_WIFI="disabled"
          fi

          if [ "$ENABLE_USB" = "true" ]; then
            WRT_USB="enabled"
          else
            WRT_USB="disabled"
          fi

          {
            echo "WRT_DATE=$(TZ=Asia/Shanghai date +"%y.%m.%d-%H.%M.%S")"
            echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}"
            echo "WRT_INFO=${WRT_SOURCE%%/*}"
            echo "WRT_TARGET=$WRT_TARGET_FROM_CONFIG"
            echo "WRT_WIFI=$WRT_WIFI"
            echo "WRT_USB=$WRT_USB"
            echo "WRT_KVER=none"
            echo "WRT_LIST=none"
          } >> "$GITHUB_ENV"

          echo "WRT_TARGET=$WRT_TARGET_FROM_CONFIG"
          echo "WRT_WIFI=$WRT_WIFI"
          echo "WRT_USB=$WRT_USB"
          echo "WRT_TEST=$WRT_TEST"

      - name: Clone Code
        shell: bash
        run: |
          set -e

          rm -rf ./wrt

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$WRT_BRANCH" \
            "$WRT_REPO" \
            ./wrt

          cd ./wrt

          WRT_HASH="$(git rev-parse HEAD)"
          echo "WRT_HASH=$WRT_HASH" >> "$GITHUB_ENV"

          echo "Using source commit: $WRT_HASH"

          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"

          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i \
              -e '/\.cn\//d' \
              -e '/tencent/d' \
              -e '/aliyun/d' \
              "$PROJECT_MIRRORS_FILE"
          fi

      - name: Check Scripts
        shell: bash
        run: |
          set -e

          find ./ \
            -maxdepth 3 \
            -type f \
            -iregex '.*\(txt\|sh\)$' \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      - name: Update Feeds
        shell: bash
        run: |
          set -e

          cd ./wrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        shell: bash
        run: |
          set -e

          cd ./wrt/package

          rm -rf openwrt-bandix luci-app-bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/openwrt-bandix.git \
            openwrt-bandix

          git clone \
            --depth=1 \
            https://github.com/timsaya/luci-app-bandix.git \
            luci-app-bandix

          "$GITHUB_WORKSPACE/Scripts/Packages.sh"
          "$GITHUB_WORKSPACE/Scripts/Handles.sh"

      - name: Fix Sing-Box Dependency
        shell: bash
        run: |
          set -e

          cd ./wrt

          rm -rf ./build_dir/target-*/sing-box-*
          rm -f ./staging_dir/target-*/pkginfo/sing-box*.default

      - name: Prepare Source Configuration
        shell: bash
        run: |
          set -e

          cd ./wrt

          # 使用当前源码对应的独立配置文件
          cat "$GITHUB_WORKSPACE/$SOURCE_CONFIG" > .config

          # 添加手动输入的软件包
          if [ -n "$WRT_PACKAGE" ]; then
            echo "$WRT_PACKAGE" >> .config
          fi

          "$GITHUB_WORKSPACE/Scripts/Settings.sh"

          # 第一次解析设备和包依赖
          make defconfig

      - name: Apply Optional Wi-Fi USB Configuration
        shell: bash
        run: |
          set -e

          cd ./wrt

          set_config() {
            key="$1"
            value="$2"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "${key}=${value}" >> .config
          }

          unset_config() {
            key="$1"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "# ${key} is not set" >> .config
          }

          package_exists() {
            package="$1"
            symbol="${package#CONFIG_PACKAGE_}"

            grep -Rqs \
              -E "^[[:space:]]*(config|menuconfig)[[:space:]]+${symbol}([[:space:]]|$)" \
              package target feeds 2>/dev/null
          }

          echo "===== OPTIONAL FEATURE CONFIGURATION ====="
          echo "Source: $SOURCE_ID"
          echo "SOURCE_ENABLE_NSS: $SOURCE_ENABLE_NSS"
          echo "ENABLE_WIFI: $ENABLE_WIFI"
          echo "ENABLE_USB: $ENABLE_USB"

          # Wi-Fi 由各自配置文件提供默认值；
          # 手动开启时补充常见用户空间组件。
          if [ "$ENABLE_WIFI" = "true" ]; then
            echo "Manual option: Wi-Fi enabled."

            for key in \
              CONFIG_PACKAGE_iw \
              CONFIG_PACKAGE_wireless-regdb \
              CONFIG_PACKAGE_wpad-openssl
            do
              if package_exists "$key"; then
                set_config "$key" y
              fi
            done

            if grep -Rqs \
              -E '^[[:space:]]*(config|menuconfig)[[:space:]]+ATH11K_NSS_MESH_SUPPORT([[:space:]]|$)' \
              package target feeds 2>/dev/null
            then
              set_config CONFIG_ATH11K_NSS_MESH_SUPPORT y
            fi
          fi

          # USB 由各自配置文件提供默认值；
          # 手动开启时补充常见 USB 组件。
          if [ "$ENABLE_USB" = "true" ]; then
            echo "Manual option: USB enabled."

            for key in \
              CONFIG_PACKAGE_kmod-usb-core \
              CONFIG_PACKAGE_kmod-usb2 \
              CONFIG_PACKAGE_kmod-usb3 \
              CONFIG_PACKAGE_usbutils \
              CONFIG_PACKAGE_usbids
            do
              if package_exists "$key"; then
                set_config "$key" y
              fi
            done
          fi

          # 只在启用对应源码 NSS 时设置 NSS 固件版本。
          # LibWrt 的 NSS 包由源码/feed/设备配置管理，
          # 这里不强行手动选择 qca-nss 子包。
          if [ "$SOURCE_ENABLE_NSS" = "true" ]; then
            if grep -Rqs \
              -E '^[[:space:]]*(config|menuconfig)[[:space:]]+NSS_FIRMWARE_VERSION_11_4([[:space:]]|$)' \
              package target feeds 2>/dev/null
            then
              set_config CONFIG_NSS_FIRMWARE_VERSION_11_4 y
            fi
          fi

          # RMNET/蜂窝 modem 无论任何模式都关闭。
          unset_config CONFIG_PACKAGE_kmod-qca-nss-rmnet
          unset_config CONFIG_PACKAGE_kmod-rmnet

          echo "===== CONFIG AFTER OPTIONAL FEATURES ====="
          grep -nEi \
            'qca-nss|qca-ssdk|rmnet|NSS_FIRMWARE|ATH11K|usb|wireless|wpad' \
            .config || true

      - name: Finalize Configuration
        shell: bash
        run: |
          set -e

          cd ./wrt

          set_config() {
            key="$1"
            value="$2"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "${key}=${value}" >> .config
          }

          unset_config() {
            key="$1"

            sed -i \
              -e "/^${key}=.*/d" \
              -e "/^# ${key} is not set$/d" \
              .config

            echo "# ${key} is not set" >> .config
          }

          # 依赖解析只在这里执行一次。
          make defconfig

          # 解析完成后只覆盖明确要求始终关闭的 RMNET。
          unset_config CONFIG_PACKAGE_kmod-qca-nss-rmnet
          unset_config CONFIG_PACKAGE_kmod-rmnet

          # 如果手动选择关闭 Wi-Fi，关闭用户空间 Wi-Fi 包。
          # 不删除 LibWrt 目标设备可能需要的 ATH11K 内核/固件配置。
          if [ "$ENABLE_WIFI" = "false" ]; then
            unset_config CONFIG_PACKAGE_iw
            unset_config CONFIG_PACKAGE_wireless-regdb
            unset_config CONFIG_PACKAGE_wpad
            unset_config CONFIG_PACKAGE_wpad-openssl
            unset_config CONFIG_PACKAGE_wpa-supplicant
            unset_config CONFIG_ATH11K_NSS_MESH_SUPPORT
          fi

          # 如果手动选择关闭 USB，关闭可选 USB 包。
          # 不强行删除被目标设备基础依赖选中的核心模块。
          if [ "$ENABLE_USB" = "false" ]; then
            unset_config CONFIG_PACKAGE_usbutils
            unset_config CONFIG_PACKAGE_usbids
            unset_config CONFIG_PACKAGE_kmod-usb-storage
            unset_config CONFIG_PACKAGE_block-mount
            unset_config CONFIG_PACKAGE_kmod-fs-ext4
            unset_config CONFIG_PACKAGE_kmod-fs-vfat
            unset_config CONFIG_PACKAGE_kmod-fs-ntfs3
          fi

          echo "===== FINAL CONFIGURATION SNAPSHOT ====="

          echo "--- NSS/RMNET ---"
          grep -E \
            '^(CONFIG_PACKAGE_(kmod-qca-nss-|kmod-qca-ssdk|qca-ssdk|nss-)|CONFIG_NSS_FIRMWARE|# CONFIG_PACKAGE_(kmod-qca-nss-rmnet|kmod-rmnet))' \
            .config || true

          echo "--- Wi-Fi ---"
          grep -E \
            '^CONFIG_PACKAGE_(iw|wireless-regdb|wpad|wpad-openssl|wpa-supplicant)=|^# CONFIG_ATH11K_NSS_MESH_SUPPORT' \
            .config || true

          echo "--- USB ---"
          grep -E \
            '^CONFIG_PACKAGE_(kmod-usb-core|kmod-usb2|kmod-usb3|usbutils|usbids|kmod-usb-storage|block-mount)=' \
            .config || true

      - name: Verify Final Configuration
        shell: bash
        run: |
          set -e

          cd ./wrt

          echo "===== FINAL CONFIGURATION CHECK ====="

          # RMNET 无条件禁止
          RMNET_ENABLED="$(
            grep -E \
              '^CONFIG_PACKAGE_(kmod-qca-nss-rmnet|kmod-rmnet)=[ym]' \
              .config || true
          )"

          if [ -n "$RMNET_ENABLED" ]; then
            echo "ERROR: RMNET/蜂窝 modem 仍然启用:"
            echo "$RMNET_ENABLED"
            exit 1
          fi

          # NSS 关闭时只检查实际启用的 NSS 包。
          if [ "$SOURCE_ENABLE_NSS" = "false" ]; then
            NSS_ENABLED="$(
              grep -E \
                '^CONFIG_PACKAGE_(kmod-qca-nss-|kmod-qca-ssdk|qca-ssdk|nss-)=[ym]' \
                .config || true
            )"

            if [ -n "$NSS_ENABLED" ]; then
              echo "ERROR: NSS/SSDK packages remain enabled for $SOURCE_ID:"
              echo "$NSS_ENABLED"
              exit 1
            fi
          fi

          # Wi-Fi/USB 只做诊断输出。
          # 某些目标依赖可能自动选中基础包，不在这里误判为源码编译错误。
          echo "===== SELECTED WIFI PACKAGES ====="
          grep -E \
            '^CONFIG_PACKAGE_(iw|wireless-regdb|wpad|wpad-openssl|wpa-supplicant)=[ym]' \
            .config || true

          echo "===== SELECTED USB PACKAGES ====="
          grep -E \
            '^CONFIG_PACKAGE_(kmod-usb-core|kmod-usb2|kmod-usb3|usbutils|usbids|kmod-usb-storage|block-mount)=[ym]' \
            .config || true

          echo "Configuration verification passed."

      - name: Diagnose NSS Selectors
        if: failure()
        shell: bash
        run: |
          cd ./wrt

          echo "===== NSS SELECTOR DIAGNOSTICS ====="

          grep -RniE \
            'qca-nss-ecm|kmod-qca-nss-ecm|nss_rmnet_rx_get_ifnum' \
            package target feeds 2>/dev/null \
            | head -300 || true

      - name: Clean Stale Build State
        if: env.WRT_TEST != 'true'
        shell: bash
        run: |
          set -e

          cd ./wrt

          rm -rf build_dir/target-*/linux-*/qca-nss-*
          rm -rf build_dir/target-*/linux-*/qca-ssdk-*

          find staging_dir/target-* \
            -type f \
            \( \
              -iname '*qca-nss*' \
              -o -iname '*qca-ssdk*' \
              -o -iname '*rmnet*' \
            \) \
            -delete 2>/dev/null || true

          rm -f tmp/.packageinfo
          rm -f tmp/.targetinfo

          echo "Stale NSS/SSDK state cleaned."

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        shell: bash
        run: |
          set -e

          cd ./wrt
          make download -j"$(nproc)"

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        shell: bash
        run: |
          set -e
          set -o pipefail

          cd ./wrt

          make -j"$(nproc)" V=s \
            2>&1 | tee "../compile-${SOURCE_ID}.log"

      - name: Show Build Diagnostics
        if: failure()
        shell: bash
        run: |
          echo "===== BUILD DIAGNOSTICS: $SOURCE_ID ====="

          if [ -f "./compile-${SOURCE_ID}.log" ]; then
            tail -300 "./compile-${SOURCE_ID}.log"
          fi

          if [ -f "./wrt/compile-${SOURCE_ID}.log" ]; then
            tail -300 "./wrt/compile-${SOURCE_ID}.log"
          fi

      - name: Package Firmware
        shell: bash
        run: |
          set -e

          cd ./wrt

          mkdir -p upload

          cp -f \
            ./.config \
            "./upload/Config-${WRT_CONFIG}-${SOURCE_ID}-${WRT_BRANCH}-${SOURCE_ENABLE_NSS}-${WRT_WIFI}-${WRT_USB}-${WRT_DATE}.txt"

          if [ "$WRT_TEST" != "true" ]; then
            MANIFEST_FILE="$(
              find ./bin/targets/ \
                -type f \
                -name '*.manifest' \
                -print -quit
            )"

            if [ -n "$MANIFEST_FILE" ]; then
              WRT_KVER="$(
                grep -oP '^kernel - \K[\d.]+' "$MANIFEST_FILE" \
                | head -n 1 || true
              )"

              WRT_LIST="$(
                grep -oP '^luci-(app|theme)[^ ]*' "$MANIFEST_FILE" \
                | tr '\n' ' ' || true
              )"

              echo "WRT_KVER=$WRT_KVER" >> "$GITHUB_ENV"
              echo "WRT_LIST=$WRT_LIST" >> "$GITHUB_ENV"
            fi

            find ./bin/targets/ \
              -type f \
              \( \
                -name '*buildinfo*' \
                -o -name '*.json' \
                -o -name 'sha256sums' \
              \) \
              -delete

            find ./bin/targets/ \
              -type d \
              -name packages \
              -prune \
              -exec rm -rf {} +

            while IFS= read -r -d '' FILE; do
              EXT="${FILE##*.}"
              BASE="$(basename "$FILE")"
              NAME="${BASE%%.*}"

              NEW_FILE="${NAME}-${SOURCE_ID}-${WRT_BRANCH}-${SOURCE_ENABLE_NSS}-${WRT_WIFI}-${WRT_USB}-${WRT_DATE}.${EXT}"

              mv -f "$FILE" "./upload/$NEW_FILE"
            done < <(
              find ./bin/targets/ \
                -type f \
                -iname "*$WRT_TARGET*" \
                -print0
            )

            find ./bin/targets/ \
              -type f \
              -exec mv -f {} ./upload/ \;

            make clean -j"$(nproc)" || true
          fi

      - name: Release Firmware
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ZN-M2-${{ env.SOURCE_ID }}-${{ env.SOURCE_ENABLE_NSS }}-${{ env.WRT_WIFI }}-${{ env.WRT_USB }}-${{ env.WRT_DATE }}
          name: ZN-M2-${{ env.SOURCE_ID }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*

          body: |
            这是为 ZN-M2 设计的固件。

            构建源：${{ env.SOURCE_ID }}
            源码：${{ env.WRT_REPO }}
            分支：${{ env.WRT_BRANCH }}
            提交：${{ env.WRT_HASH }}

            配置文件：${{ env.SOURCE_CONFIG }}
            NSS 加速：${{ env.SOURCE_ENABLE_NSS }}
            Wi-Fi：${{ env.WRT_WIFI }}
            USB：${{ env.WRT_USB }}
            RMNET/蜂窝 modem：始终禁用

            平台：${{ env.WRT_TARGET }}
            登录地址：${{ env.WRT_IP }}
            登录密码：${{ env.WRT_PW }}

            内核版本：${{ env.WRT_KVER }}
            插件列表：${{ env.WRT_LIST }}

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2-${{ env.SOURCE_ID }}-${{ env.SOURCE_ENABLE_NSS }}-${{ env.WRT_WIFI }}-${{ env.WRT_USB }}
          path: ./wrt/upload/*
          if-no-files-found: warn
