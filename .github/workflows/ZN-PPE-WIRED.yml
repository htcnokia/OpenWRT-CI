#CI项目
name: ZN-PPE-WIRED

#CI计划（手动触发）
on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [ZN-PPE-WIRED]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    #调用公用编译核心
    uses: ./.github/workflows/ZN-PPE-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题（源码自带，无额外依赖）
      WRT_THEME: bootstrap
      WRT_NAME: ZN-PPE
      WRT_IP: 192.168.188.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      WRT_TEST: ${{inputs.TEST || false}}
