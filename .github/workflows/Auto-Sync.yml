name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【仅编译】指定配置与参数魔改
    - name: Force Modify Downloaded Workflows & Scripts
      run: |
        # ① 处理 Scripts/Packages.sh
        if [ -f "Scripts/Packages.sh" ]; then
          # 1. 替换 timecontrol 为 gaobin89 版本
          sed -i 's|UPDATE_PACKAGE "timecontrol" "sirpdboy/luci-app-timecontrol" "main"|UPDATE_PACKAGE "timecontrol" "gaobin89/luci-app-timecontrol" "js"|g' Scripts/Packages.sh
          
          # 2. 更换/追加 gecoosac 为 laipeng668 版本
          if ! grep -qF "laipeng668/luci-app-gecoosac" Scripts/Packages.sh; then
            #sed -i '/UPDATE_PACKAGE "viking" "VIKINGYFY\/packages"/s/^/#/' Scripts/Packages.sh

            echo '' >> Scripts/Packages.sh
            
            # 1. 精准删除 Handles.sh 中的私有扩展脚本块（区间删除，不误伤其他 fi）
            if [ -f "Scripts/Packages.sh" ]; then
              echo "正在清除 Packages.sh 尾部的私有扩展脚本块..."
              # 执行删除命令
              sed -i '/#引入私有扩展脚本/,/fi/d' Scripts/Packages.sh
              # 判断是否还包含特征关键字
              if ! grep -qF "#引入私有扩展脚本" Scripts/Packages.sh; then
                echo "✅ 清除成功：Packages.sh 中的私有扩展脚本块已被移除。"
              else
                echo "⚠️ 清除失败：Packages.sh 中依然存在私有扩展脚本块，请检查文件内容格式。"
              fi
            fi
            
            echo 'UPDATE_PACKAGE "luci-app-gecoosac" "laipeng668/luci-app-gecoosac" "main" "" "gecoosac luci-app-gecoosac"' >> Scripts/Packages.sh

            # 2. 添加备份文件夹路径
            if ! grep -q "^mkdir -p files/etc$" Scripts/Packages.sh; then 
              echo '' >> Scripts/Packages.sh
              echo 'mkdir -p files/etc' >> Scripts/Packages.sh 
              echo 'touch files/etc/sysupgrade.conf' >> Scripts/Packages.sh 
              echo 'echo "/etc/homeproxy/private_srs" >> files/etc/sysupgrade.conf' >> Scripts/Packages.sh 
              echo 'chmod 644 files/etc/sysupgrade.conf' >> Scripts/Packages.sh
            fi
            
            # 3.确保单独换行追加 if...fi
            echo '#引入私有扩展脚本' >> Scripts/Packages.sh
            echo 'if [ -f "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh" ]; then' >> Scripts/Packages.sh
            echo '	source "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh"' >> Scripts/Packages.sh
            echo 'fi' >> Scripts/Packages.sh
          fi
          echo "🎯 Scripts/Packages.sh: updated gecoosac"
           
          # 处理 Handles.sh 插入编译期与运行时资源更新脚本
          if [ -f "Scripts/Handles.sh" ] && ! grep -qF "ABS_RM" Scripts/Handles.sh; then
            echo '' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo '# 1. 编译期下载 SRS 文件直接打包进固件' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo 'SEARCH_BASE="${PKG_PATH:-.}"' >> Scripts/Handles.sh
            echo 'HP_TARGET_DIR=$(find "$SEARCH_BASE" -maxdepth 3 -type d -name "*homeproxy*" -print -quit)' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  TARGET_SRS_DIR="$HP_TARGET_DIR/root/etc/homeproxy/private_srs"' >> Scripts/Handles.sh
            echo 'else' >> Scripts/Handles.sh
            echo '  TARGET_SRS_DIR="files/etc/homeproxy/private_srs"' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
            echo 'mkdir -p "$TARGET_SRS_DIR"' >> Scripts/Handles.sh
            echo 'RAW_URL="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite"' >> Scripts/Handles.sh
            echo 'for file in google.srs private.srs category-ads-all.srs cn.srs '\''geolocation-!cn.srs'\''; do' >> Scripts/Handles.sh
            echo '  curl -sSL "$RAW_URL/$file" -o "$TARGET_SRS_DIR/$file"' >> Scripts/Handles.sh
            echo 'done' >> Scripts/Handles.sh
            echo '' >> Scripts/Handles.sh
            echo '# 编译期直接清理面板里的无用字体' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  TARGET_FILENAME="ibm-plex-mono-cyrillic-400-normal-BSMlKf0J.woff2"' >> Scripts/Handles.sh
            echo '  ABS_RM="$HP_TARGET_DIR/root/etc/homeproxy/dashboard/assets/$TARGET_FILENAME"' >> Scripts/Handles.sh
            echo '  if [ -f "$ABS_RM" ]; then' >> Scripts/Handles.sh
            echo '    rm -f "$ABS_RM"' >> Scripts/Handles.sh
            echo '  fi' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
            echo '' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo '# 2. 注入运行期更新逻辑到 update_resources.sh' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  ts=$(find "$HP_TARGET_DIR" -type f -name "update_resources.sh" -print -quit)' >> Scripts/Handles.sh
            echo '  if [ -f "$ts" ] && ! grep -qF "private_srs" "$ts"; then' >> Scripts/Handles.sh
            echo '    awk '\''/finish\(\) \{/ { print; print "  rm -f \"$DASHBOARD_DIR/assets/ibm-plex-mono-cyrillic-400-normal-BSMlKf0J.woff2\""; print "  mkdir -p /etc/homeproxy/private_srs"; print "  srs_base_url=\"https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite\""; print "  for file in google.srs private.srs category-ads-all.srs cn.srs \"geolocation-!cn.srs\"; do"; print "    run_curl -fsSL \"$srs_base_url/$file\" -o \"/etc/homeproxy/private_srs/$file\""; print "  done"; next }1'\'' "$ts" > "$ts.tmp" && mv "$ts.tmp" "$ts" && chmod +x "$ts"' >> Scripts/Handles.sh
            echo '  fi' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
          fi
          
        fi
        
        # ② 禁用不需要的自动触发
        [ -f ".github/workflows/MTK-ALL.yml" ] && sed -i '/workflow_run:/,/completed/ {s/^/#/}' .github/workflows/MTK-ALL.yml

        # ③ 修改 OWRT-ALL.yml (X86)
        if [ -f ".github/workflows/OWRT-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[X86\]|g' .github/workflows/OWRT-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/OWRT-ALL.yml
          echo "🎯 OWRT-ALL.yml: Constrained to X86 & IP set to 188.1"
        fi

        # ④ 修改 QCA-ALL.yml (IPQ60XX)
        if [ -f ".github/workflows/QCA-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[IPQ60XX-WIFI-NO\]|g' .github/workflows/QCA-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/QCA-ALL.yml
          echo "🎯 QCA-ALL.yml: Constrained to IPQ60XX-WIFI-NO & IP set to 188.1"
        fi

    - name: Patch dockerd Makefile to skip missing nested executables
      run: |
        FILE="feeds/packages/utils/dockerd/Makefile"
        
        if [ ! -f "$FILE" ]; then
          echo "ℹ️ $FILE 不存在，跳过修补 (可能需要在编译 Workflow 的 feeds update 后处理)"
          exit 0
        fi

        # 使用 sed 精确匹配替换 cp 行
        OLD_PATTERN='cp \$(BUNDLED_BINARIES) bundles/binary-daemon/'
        NEW_PATTERN='for f in \$(BUNDLED_BINARIES); do [ -n "\$\$f" ] \&\& [ -f "\$\$f" ] \&\& cp "\$\$f" bundles/binary-daemon/ || echo "Skipping missing executable: \$\$f"; done'

        if grep -q 'cp \$(BUNDLED_BINARIES) bundles/binary-daemon/' "$FILE"; then
          sed -i "s|${OLD_PATTERN}|${NEW_PATTERN}|g" "$FILE"
          echo "✅ 已成功修补 $FILE"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "CI: guard cp in dockerd Makefile" || true
        else
          echo "ℹ️ 未在 $FILE 中查找到需替换的目标行，可能已被修补或文件格式已改变。"
        fi
        
    - name: Ensure PRIVATE and IPQ60XX configs have intended package entries
      run: |
        set -euo pipefail
    
        ENABLE_PKGS=(
          "conntrack" "dig" "tcpdump" "tree" "bash" "curl" "ip-full"
          "ddns-scripts-services" "ddns-scripts" "luci-app-ddns"
          "luci-app-timecontrol" "luci-app-cpufreq" "ttyd" "luci-app-ttyd"
          "luci-i18n-ttyd-zh-cn" "kmod-nft-tproxy" "ca-bundle"
        )
    
        DISABLE_PKGS=(
          "dockerd" "docker" "containerd" "docker-compose"
          "luci-app-dockerman" "luci-lib-docker"
          "luci-app-samba4" "samba4-server" "samba4-libs"
          "ksmbd" "luci-app-ksmbd" "python3"
        )
    
        PRIVATE_FILE="Config/PRIVATE.txt"
        IPQ_FILE="Config/IPQ60XX-WIFI-NO.txt"
    
        # Ensure PRIVATE file exists
        mkdir -p "$(dirname "$PRIVATE_FILE")"
        touch "$PRIVATE_FILE"
    
        echo "🔧 Applying enable-list to $PRIVATE_FILE (idempotent)"
        for pkg in "${ENABLE_PKGS[@]}"; do
          key="CONFIG_PACKAGE_${pkg}"
          # If already explicitly enabled, skip
          if grep -qE "^${key}=y" "$PRIVATE_FILE"; then
            echo "  - ${key}=y already present, skip"
            continue
          fi
    
          # Remove any prior conflicting lines (explicit set or commented 'is not set' form)
          sed -i "/^${key}=.*/d; /^# CONFIG_PACKAGE_${pkg} is not set/d; /^# ${key}=.*/d" "$PRIVATE_FILE" || true
    
          # Append the enabled entry
          printf '%s\n' "${key}=y" >> "$PRIVATE_FILE"
          echo "  - Added ${key}=y"
        done
    
        echo "🔧 Applying disable-list to $IPQ_FILE (idempotent, only for this file)"
        if [ -f "$IPQ_FILE" ]; then
          for pkg in "${DISABLE_PKGS[@]}"; do
            key="CONFIG_PACKAGE_${pkg}"
            # If already explicitly disabled or already has the `# CONFIG_PACKAGE_xxx is not set` line, skip
            if grep -qE "^${key}=n" "$IPQ_FILE" || grep -qE "^# CONFIG_PACKAGE_${pkg} is not set" "$IPQ_FILE"; then
              echo "  - ${key} already disabled or commented, skip"
              continue
            fi
    
            # Remove any enabling lines to avoid conflicts
            sed -i "/^${key}=.*/d; /^# ${key}=.*/d; /^# CONFIG_PACKAGE_${pkg} is not set/d" "$IPQ_FILE" || true
    
            # Append the disabled entry
            printf '%s\n' "${key}=n" >> "$IPQ_FILE"
            echo "  - Added ${key}=n"
          done
        else
          echo "  - $IPQ_FILE not found, skipping disable-list"
        fi
    
        echo "✅ Config injection step complete."
        
    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
