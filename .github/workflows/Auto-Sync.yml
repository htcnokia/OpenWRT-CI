name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【仅编译】指定配置与参数魔改
    - name: Force Modify Downloaded Workflows & Scripts
      run: |
        # ① 处理timecontrol
        sed -i 's|UPDATE_PACKAGE "timecontrol" "sirpdboy/luci-app-timecontrol" "main"|UPDATE_PACKAGE "timecontrol" "gaobin89/luci-app-timecontrol" "js"|g' Scripts/Packages.sh      
        # ① 禁用不需要的自动触发
        [ -f ".github/workflows/MTK-ALL.yml" ] && sed -i '/workflow_run:/,/completed/ {s/^/#/}' .github/workflows/MTK-ALL.yml

        # ② 修改 OWRT-ALL.yml (X86)：限制矩阵为 X86，并修改默认 IP
        if [ -f ".github/workflows/OWRT-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[X86\]|g' .github/workflows/OWRT-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/OWRT-ALL.yml
          echo "🎯 OWRT-ALL.yml: Constrained to X86 & IP set to 188.1"
        fi

        # ③ 修改 QCA-ALL.yml (IPQ60XX)：限制矩阵为 IPQ60XX-WIFI-NO，并修改默认 IP
        if [ -f ".github/workflows/QCA-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[IPQ60XX-WIFI-NO\]|g' .github/workflows/QCA-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/QCA-ALL.yml
          echo "🎯 QCA-ALL.yml: Constrained to IPQ60XX-WIFI-NO & IP set to 188.1"
        fi

        # ④ 对 WRT-CORE.yml 的注入
        CORE_FILE=".github/workflows/WRT-CORE.yml"
        CORE_MARKER="# --- PRIVATE.SH INJECTED ---"

        if [ -f "$CORE_FILE" ] && ! grep -qF "$CORE_MARKER" "$CORE_FILE"; then
          echo "🔧 Injecting PRIVATE.sh sourcing into $CORE_FILE"

          # 在找到 Settings.sh 行后追加注入块（保持与原 run: | 的 shell 脚本结构一致）
          awk -v marker="$CORE_MARKER" '
            $0 ~ /\$GITHUB_WORKSPACE\/Scripts\/Settings.sh/ {
              print
              print "          " marker
              print "          # If PRIVATE.sh exists, source it now (after .config created)"
              print "          if [ -f \"$GITHUB_WORKSPACE/Scripts/PRIVATE.sh\" ]; then"
              print "            source \"$GITHUB_WORKSPACE/Scripts/PRIVATE.sh\""
              print "          fi"
              next
            }
            { print }
          ' "$CORE_FILE" > "$CORE_FILE.tmp" && mv "$CORE_FILE.tmp" "$CORE_FILE"

          echo "✅ Injection complete: $CORE_FILE updated."
        else
          echo "ℹ️ $CORE_FILE not found or already contains injection marker."
        fi

    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
