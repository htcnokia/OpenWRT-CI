name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【精准修复与修改】 批量给多个配置文件追加禁用 & 启用组件配置（多文件数组 + 配置数组）
    - name: Force Modify Downloaded Workflows
      run: |
        TARGET_FILES=(
          "Config/IPQ60XX-WIFI-NO.txt"
          "Config/IPQ60XX-WIFI-YES.txt"
        )
        
        MARKER="# --- AUTO INJECTED CONFIG ---"

        # 定义需要【禁用】的组件列表
        DISABLE_PKGS=(
          "dockerd"
          "docker"
          "containerd"
          "docker-compose"
          "luci-app-dockerman"
          "luci-lib-docker"
          "luci-app-samba4"
          "samba4-server"
          "samba4-libs"
          "python3"
        )

        # 定义需要【启用】的组件列表
        ENABLE_PKGS=(
          "conntrack"
          "dig"
          "tcpdump"
          "tree"
          "bash"
          "curl"
          "ip-full"
          "ddns-scripts-services"
          "ddns-scripts"
          "luci-app-ddns"
          "luci-app-timecontrol"
          "luci-app-cpufreq"
          "ttyd"
          "luci-app-ttyd"
          "luci-i18n-ttyd-zh-cn"
          "kmod-nft-tproxy"
          "ca-bundle"
        )

        # 遍历每一个目标文件
        for target in "${TARGET_FILES[@]}"; do
          if [ -f "$target" ]; then
            # 检查防重标记
            if grep -q "$MARKER" "$target"; then
              echo "ℹ️ 配置已注入过，跳过: $target"
            else
              echo "🛡️ 正在注入自定义配置到 $target..."
              
              {
                echo ""
                echo "$MARKER"
                echo "# 自动注入禁用配置"
              } >> "$target"

              for pkg in "${DISABLE_PKGS[@]}"; do
                echo "CONFIG_PACKAGE_${pkg}=n" >> "$target"
              done

              echo "# 自动注入启用配置" >> "$target"

              for pkg in "${ENABLE_PKGS[@]}"; do
                echo "CONFIG_PACKAGE_${pkg}=y" >> "$target"
              done

              echo "✅ 成功注入配置到: $target"
            fi
          else
            echo "⚠️ 文件不存在，跳过: $target"
          fi
        done

    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
