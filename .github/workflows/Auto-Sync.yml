name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【仅编译】指定配置
    - name: Force Modify Downloaded Workflows & Scripts
      run: |
        # ① 禁用其他工作流触发
        [ -f ".github/workflows/MTK-ALL.yml" ] && sed -i '/workflow_run:/,/completed/ {s/^/#/}' .github/workflows/MTK-ALL.yml
        [ -f ".github/workflows/OWRT-ALL.yml" ] && sed -i 's|CONFIG: \[.*\]|CONFIG: \[X86\]|g' .github/workflows/OWRT-ALL.yml
        [ -f ".github/workflows/QCA-ALL.yml" ] && sed -i 's|CONFIG: \[.*\]|CONFIG: \[IPQ60XX-WIFI-NO\]|g' .github/workflows/QCA-ALL.yml

        # ② 处理 Handles.sh
        HANDLES_FILE="Scripts/Handles.sh"
        MARKER="### --- IPQ60XX CUSTOM PATCH --- ###"

        if [ -f "$HANDLES_FILE" ]; then
          # 静态替换面板源
          sed -i 's|HP_DASHBOARD_SOURCE=.*|HP_DASHBOARD_SOURCE="https://codeload.github.com/MetaCubeX/Yacd-meta/zip/refs/heads/gh-pages"|g' "$HANDLES_FILE"
          
          # 防重注入逻辑
          if ! grep -q "$MARKER" "$HANDLES_FILE"; then
            echo "💉 Injecting IPQ60XX logic via printf..."
            
            # 使用 printf 逐行追加，彻底避开 EOF 缩进报错问题
            {
              echo ""
              echo "$MARKER"
              echo 'if [ -f ".config" ]; then'
              echo '    TARGET_BOARD=$(grep "CONFIG_TARGET_BOARD=" .config | cut -d'="'" -f2 | tr -d '"')" '
              echo '    TARGET_SUBTARGET=$(grep "CONFIG_TARGET_SUBTARGET=" .config | cut -d'="'" -f2 | tr -d '"')" '
              echo ''
              echo '    if [[ "$TARGET_BOARD" == "qualcommax" && "$TARGET_SUBTARGET" == "ipq60xx" ]]; then'
              echo '        echo "🛡️ IPQ60XX Detected: Applying exclusive component trimming..."'
              echo '        DISABLE_PKGS=("dockerd" "docker" "containerd" "docker-compose" "luci-app-dockerman" "luci-lib-docker" "luci-app-samba4" "samba4-server" "samba4-libs" "ksmbd" "luci-app-ksmbd" "python3")'
              echo '        ENABLE_PKGS=("conntrack" "dig" "tcpdump" "tree" "bash" "curl" "ip-full" "ddns-scripts-services" "ddns-scripts" "luci-app-ddns" "luci-app-timecontrol" "luci-app-cpufreq" "ttyd" "luci-app-ttyd" "luci-i18n-ttyd-zh-cn" "kmod-nft-tproxy" "ca-bundle")'
              echo ''
              echo '        for pkg in "${DISABLE_PKGS[@]}"; do'
              echo '            sed -i "s/CONFIG_PACKAGE_${pkg}=y/# CONFIG_PACKAGE_${pkg} is not set/g" .config'
              echo '            echo "CONFIG_PACKAGE_${pkg}=n" >> .config'
              echo '        done'
              echo ''
              echo '        for pkg in "${ENABLE_PKGS[@]}"; do'
              echo '            sed -i "s/.*CONFIG_PACKAGE_${pkg}=.*/CONFIG_PACKAGE_${pkg}=y/g" .config'
              echo '            grep -q "CONFIG_PACKAGE_${pkg}=y" .config || echo "CONFIG_PACKAGE_${pkg}=y" >> .config'
              echo '        done'
              echo '    fi'
              echo 'fi'
            } >> "$HANDLES_FILE"
            
            echo "✅ Injection completed."
          fi
        fi


    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
