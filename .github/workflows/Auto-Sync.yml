name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【仅编译】指定配置与参数魔改
    - name: Force Modify Downloaded Workflows & Scripts
      run: |
        # ① 处理 Scripts/Packages.sh
        if [ -f "Scripts/Packages.sh" ]; then
          # 1. 替换 timecontrol 为 gaobin89 版本
          sed -i 's|UPDATE_PACKAGE "timecontrol" "sirpdboy/luci-app-timecontrol" "main"|UPDATE_PACKAGE "timecontrol" "gaobin89/luci-app-timecontrol" "js"|g' Scripts/Packages.sh
          
          # 2. 更换/追加 gecoosac 为 laipeng668 版本
          if ! grep -qF "laipeng668/luci-app-gecoosac" Scripts/Packages.sh; then
            echo '' >> Scripts/Packages.sh
            
            # 2.1. 精准删除 Packages.sh 尾部的私有扩展脚本块
            if [ -f "Scripts/Packages.sh" ]; then
              echo "正在清除 Packages.sh 尾部的私有扩展脚本块..."
              sed -i '/#引入私有扩展脚本/,/fi/d' Scripts/Packages.sh
            fi
            
            # 2.2. 强删 viking 大杂烩包中的旧版 gecoosac 源码，再拉取 laipeng668 新版
            echo 'find . -maxdepth 4 -type d \( -name "*gecoosac*" \) -exec rm -rf {} +' >> Scripts/Packages.sh
            echo 'UPDATE_PACKAGE "luci-app-gecoosac" "laipeng668/luci-app-gecoosac" "main" "" "gecoosac luci-app-gecoosac"' >> Scripts/Packages.sh

            # 2.3. 添加备份文件夹路径
            if ! grep -q "^mkdir -p files/etc$" Scripts/Packages.sh; then 
              echo '' >> Scripts/Packages.sh
              echo 'mkdir -p files/etc' >> Scripts/Packages.sh 
              echo 'touch files/etc/sysupgrade.conf' >> Scripts/Packages.sh 
              echo 'echo "/etc/homeproxy/private_srs" >> files/etc/sysupgrade.conf' >> Scripts/Packages.sh 
              echo 'chmod 644 files/etc/sysupgrade.conf' >> Scripts/Packages.sh
            fi
            
            # 2.4. 确保单独换行追加 if...fi
            echo '#引入私有扩展脚本' >> Scripts/Packages.sh
            echo 'if [ -f "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh" ]; then' >> Scripts/Packages.sh
            echo '	source "$GITHUB_WORKSPACE/Scripts/PRIVATE.sh"' >> Scripts/Packages.sh
            echo 'fi' >> Scripts/Packages.sh
          fi
          echo "🎯 Scripts/Packages.sh: updated gecoosac"
           
          # 处理 Handles.sh 插入编译期与运行时资源更新脚本
          if [ -f "Scripts/Handles.sh" ] && ! grep -qF "ABS_RM" Scripts/Handles.sh; then
            echo '' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo '# 1. 编译期下载 SRS 文件直接打包进固件' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo 'SEARCH_BASE="${PKG_PATH:-.}"' >> Scripts/Handles.sh
            echo 'HP_TARGET_DIR=$(find "$SEARCH_BASE" -maxdepth 3 -type d -name "*homeproxy*" -print -quit)' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  TARGET_SRS_DIR="$HP_TARGET_DIR/root/etc/homeproxy/private_srs"' >> Scripts/Handles.sh
            echo 'else' >> Scripts/Handles.sh
            echo '  TARGET_SRS_DIR="files/etc/homeproxy/private_srs"' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
            echo 'mkdir -p "$TARGET_SRS_DIR"' >> Scripts/Handles.sh
            echo 'RAW_URL="https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite"' >> Scripts/Handles.sh
            echo 'for file in google.srs private.srs category-ads-all.srs cn.srs '\''geolocation-!cn.srs'\''; do' >> Scripts/Handles.sh
            echo '  curl -sSL "$RAW_URL/$file" -o "$TARGET_SRS_DIR/$file"' >> Scripts/Handles.sh
            echo 'done' >> Scripts/Handles.sh
            echo '' >> Scripts/Handles.sh
            echo '# 编译期直接清理面板里的无用字体' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  TARGET_FILENAME="ibm-plex-mono-cyrillic-400-normal-BSMlKf0J.woff2"' >> Scripts/Handles.sh
            echo '  ABS_RM="$HP_TARGET_DIR/root/etc/homeproxy/dashboard/assets/$TARGET_FILENAME"' >> Scripts/Handles.sh
            echo '  if [ -f "$ABS_RM" ]; then' >> Scripts/Handles.sh
            echo '    rm -f "$ABS_RM"' >> Scripts/Handles.sh
            echo '  fi' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
            echo '' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo '# 2. 注入运行期更新逻辑到 update_resources.sh' >> Scripts/Handles.sh
            echo '# ---------------------------------------------------------' >> Scripts/Handles.sh
            echo 'if [ -n "$HP_TARGET_DIR" ]; then' >> Scripts/Handles.sh
            echo '  ts=$(find "$HP_TARGET_DIR" -type f -name "update_resources.sh" -print -quit)' >> Scripts/Handles.sh
            echo '  if [ -f "$ts" ] && ! grep -qF "private_srs" "$ts"; then' >> Scripts/Handles.sh
            echo '    awk '\''/finish\(\) \{/ { print; print "  rm -f \"$DASHBOARD_DIR/assets/ibm-plex-mono-cyrillic-400-normal-BSMlKf0J.woff2\""; print "  mkdir -p /etc/homeproxy/private_srs"; print "  srs_base_url=\"https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite\""; print "  for file in google.srs private.srs category-ads-all.srs cn.srs \"geolocation-!cn.srs\"; do"; print "    run_curl -fsSL \"$srs_base_url/$file\" -o \"/etc/homeproxy/private_srs/$file\""; print "  done"; next } /mv "$DASHBOARD_STAGE" "$DASHBOARD_DIR"/ { print; print "  rm -f \"$DASHBOARD_DIR/assets/ibm-plex-mono-cyrillic-400-normal-BSMlKf0J.woff2\""; next }1'\'' "$ts" > "$ts.tmp" && mv "$ts.tmp" "$ts" && chmod +x "$ts"' >> Scripts/Handles.sh
            echo '  fi' >> Scripts/Handles.sh
            echo 'fi' >> Scripts/Handles.sh
          fi
          
        fi
        
        # ② 禁用不需要的自动触发
        [ -f ".github/workflows/MTK-ALL.yml" ] && sed -i '/workflow_run:/,/completed/ {s/^/#/}' .github/workflows/MTK-ALL.yml

        # ③ 修改 OWRT-ALL.yml (X86)
        if [ -f ".github/workflows/OWRT-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[X86\]|g' .github/workflows/OWRT-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/OWRT-ALL.yml
          echo "🎯 OWRT-ALL.yml: Constrained to X86 & IP set to 188.1"
        fi

        # ④ 修改 QCA-ALL.yml (IPQ60XX)
        if [ -f ".github/workflows/QCA-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[IPQ60XX-WIFI-NO\]|g' .github/workflows/QCA-ALL.yml
          sed -i 's|WRT_IP: 192.168.10.1|WRT_IP: 192.168.188.1|g' .github/workflows/QCA-ALL.yml
          echo "🎯 QCA-ALL.yml: Constrained to IPQ60XX-WIFI-NO & IP set to 188.1"
        fi

    - name: Patch dockerd Makefile to skip missing nested executables
      run: |
        FILE="feeds/packages/utils/dockerd/Makefile"
        
        if [ ! -f "$FILE" ]; then
          echo "ℹ️ $FILE 不存在，跳过修补 (可能需要在编译 Workflow 的 feeds update 后处理)"
          exit 0
        fi

        # 使用 sed 精确匹配替换 cp 行
        OLD_PATTERN='cp \$(BUNDLED_BINARIES) bundles/binary-daemon/'
        NEW_PATTERN='for f in \$(BUNDLED_BINARIES); do [ -n "\$\$f" ] \&\& [ -f "\$\$f" ] \&\& cp "\$\$f" bundles/binary-daemon/ || echo "Skipping missing executable: \$\$f"; done'

        if grep -q 'cp \$(BUNDLED_BINARIES) bundles/binary-daemon/' "$FILE"; then
          sed -i "s|${OLD_PATTERN}|${NEW_PATTERN}|g" "$FILE"
          echo "✅ 已成功修补 $FILE"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "CI: guard cp in dockerd Makefile" || true
        else
          echo "ℹ️ 未在 $FILE 中查找到需替换的目标行，可能已被修补或文件格式已改变。"
        fi
        
    - name: Ensure PRIVATE and IPQ60XX configs have intended package entries
      run: |
        set -euo pipefail

        # 1. 应用全局通用启用列表 -> Config/PRIVATE.txt
        ENABLE_PKGS=(
          "conntrack" "dig" "tcpdump" "tree" "bash" "curl" "ip-full"
          "ddns-scripts-services" "ddns-scripts" "luci-app-ddns"
          "luci-app-timecontrol" "luci-app-cpufreq" "ttyd" "luci-app-ttyd"
          "luci-i18n-ttyd-zh-cn" "kmod-nft-tproxy" "ca-bundle"
        )

        PRIVATE_FILE="Config/PRIVATE.txt"
        mkdir -p "$(dirname "$PRIVATE_FILE")"
        touch "$PRIVATE_FILE"

        echo "🔧 1. 应用通用启用列表到 $PRIVATE_FILE..."
        for pkg in "${ENABLE_PKGS[@]}"; do
          key="CONFIG_PACKAGE_${pkg}"
          sed -i "/^# ${key} is not set/d; /^${key}=.*/d" "$PRIVATE_FILE" || true
          echo "${key}=y" >> "$PRIVATE_FILE"
        done

        # 2. 全局剥离：处理 Config/GENERAL.txt 中的 samba4
        GEN_FILE="Config/GENERAL.txt"
        if [ -f "$GEN_FILE" ]; then
          echo "🔧 2. 从 $GEN_FILE 中注释/注释掉默认的 samba4 组件..."
          sed -i 's/^CONFIG_PACKAGE_luci-app-samba4=y/# CONFIG_PACKAGE_luci-app-samba4 is not set/g' "$GEN_FILE" || true
          sed -i 's/^CONFIG_PACKAGE_samba4-server=y/# CONFIG_PACKAGE_samba4-server is not set/g' "$GEN_FILE" || true
        fi

        # 3. 数组补补偿：为其他所有 Config 文件补回 samba4（排除 IPQ60XX-WIFI-NO.txt）
        OTHER_CONFIGS=(
          "Config/IPQ60XX-WIFI-YES.txt"
          "Config/IPQ807X-WIFI-NO.txt"
          "Config/IPQ807X-WIFI-YES.txt"
          "Config/MEDIATEK-WIFI-NO.txt"
          "Config/MEDIATEK-WIFI-YES.txt"
          "Config/ROCKCHIP.txt"
          "Config/X86.txt"
        )

        echo "🔧 3. 数组遍历：为除 IPQ60XX-WIFI-NO 外的其它 Targets 重新补充 samba4..."
        for cfg in "${OTHER_CONFIGS[@]}"; do
          if [ -f "$cfg" ]; then
            if ! grep -qF "CONFIG_PACKAGE_luci-app-samba4=y" "$cfg"; then
              echo "CONFIG_PACKAGE_luci-app-samba4=y" >> "$cfg"
            fi
          fi
        done

        # 4. 精准精炼：对 Config/IPQ60XX-WIFI-NO.txt 注入完整的禁用列表
        IPQ_FILE="Config/IPQ60XX-WIFI-NO.txt"
        IPQ_DISABLE_PKGS=(
          "dockerd" "docker" "containerd" "docker-compose" "luci-app-dockerman" "luci-lib-docker"
          "luci-app-samba4" "samba4-server" "samba4-libs" "ksmbd" "luci-app-ksmbd" "kmod-fs-ksmbd" "python3"
          "luci-app-mini-diskmanager" "luci-app-partexp" "automount" "smartmontools" "smartmontools-drivedb"
          "fdisk" "gdisk" "cfdisk" "sfdisk" "sgdisk" "blkid" "exfat-fsck" "exfat-mkfs"
          "kmod-usb-core" "kmod-usb3" "kmod-usb-storage" "kmod-usb-storage-extras" "kmod-usb-storage-uas"
          "kmod-usb-ohci" "kmod-usb-uhci" "kmod-usb-xhci" "kmod-usb-dwc3" "kmod-usb-audio" "kmod-usb-net"
          "usb-modeswitch" "usbmuxd" "usbutils" "libimobiledevice"
          "kmod-ath" "kmod-ath11k" "kmod-ath11k-ahb" "kmod-ath11k-pci"
          "ath11k-firmware-ipq6018" "ath11k-firmware-ipq6018-ddwrt"
          "ath11k-firmware-qcn9074" "ath11k-firmware-qcn9074-ddwrt"
        )

        if [ -f "$IPQ_FILE" ]; then
          echo "🔧 4. 应用精炼禁用列表到 $IPQ_FILE..."
          for pkg in "${IPQ_DISABLE_PKGS[@]}"; do
            key="CONFIG_PACKAGE_${pkg}"
            sed -i "/^${key}=.*/d; /^# ${key} is not set/d" "$IPQ_FILE" || true
            echo "# ${key} is not set" >> "$IPQ_FILE"
          done
        fi

        # 5. 注入源码级物理强删逻辑到 Scripts/Packages.sh
        if [ -f "Scripts/Packages.sh" ] && ! grep -qF "IPQ60XX_PHYSICAL_CLEANUP" Scripts/Packages.sh; then
          echo '' >> Scripts/Packages.sh
          echo '# --- IPQ60XX_PHYSICAL_CLEANUP: 物理删除禁用组件源码 ---' >> Scripts/Packages.sh
          echo 'if [[ "${WRT_CONFIG,,}" == *"ipq60xx"* ]]; then' >> Scripts/Packages.sh
          echo '  echo "🧹 检测到 IPQ60XX 环境，开始从源码目录物理强删禁用组件..."' >> Scripts/Packages.sh
          echo '  RM_PKGS=("dockerd" "docker" "containerd" "docker-compose" "luci-app-dockerman" "luci-lib-docker" "luci-app-samba4" "samba4-server" "samba4-libs" "ksmbd" "luci-app-ksmbd" "python3" "luci-app-mini-diskmanager" "luci-app-partexp" "ath11k-firmware-ipq6018" "ath11k-firmware-qcn9074")' >> Scripts/Packages.sh
          echo '  for pkg in "${RM_PKGS[@]}"; do' >> Scripts/Packages.sh
          echo '    find . -maxdepth 4 -type d -name "$pkg" -exec rm -rf {} +' >> Scripts/Packages.sh
          echo '  done' >> Scripts/Packages.sh
          echo 'fi' >> Scripts/Packages.sh
        fi

        echo "✅ Config 静态打补丁完成，等待 Git Push Commit！"

    - name: Inject 1GB RAM & Syslog RAM-Only optimizations into Scripts/Settings.sh
      run: |
        set -euo pipefail

        SETTINGS_SH="Scripts/Settings.sh"

        if [ -f "$SETTINGS_SH" ] && ! grep -qF "IPQ60XX_SYSCTL_1GB" "$SETTINGS_SH"; then
          echo "🔧 正在注入 1GB RAM 与日志保护逻辑到 $SETTINGS_SH..."

          echo '' >> "$SETTINGS_SH"
          echo '# --- IPQ60XX_SYSCTL_1GB: 1GB RAM 专属内核优化与日志写内存 ---' >> "$SETTINGS_SH"
          echo 'if [[ "${WRT_CONFIG,,}" == *"ipq60xx"* ]]; then' >> "$SETTINGS_SH"
          echo '  echo "🚀 正在为 IPQ60XX (1GB RAM) 注入内核参数与闪存保护配置..."' >> "$SETTINGS_SH"
          
          # 1. 内存与网络内核参数优化 (files/etc/sysctl.conf)
          echo '  SYSCTL_CONF="files/etc/sysctl.conf"' >> "$SETTINGS_SH"
          echo '  mkdir -p "$(dirname "$SYSCTL_CONF")"' >> "$SETTINGS_SH"
          echo '  touch "$SYSCTL_CONF"' >> "$SETTINGS_SH"

          # 调整 Conntrack 表与 Hash 映射
          echo '  sed -i '\''/net.netfilter.nf_conntrack_max/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "net.netfilter.nf_conntrack_max=131072" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"
          echo '  sed -i '\''/net.netfilter.nf_conntrack_tcp_timeout_established/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "net.netfilter.nf_conntrack_tcp_timeout_established=7400" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"

          # 优化 Socket 队列与 TFO
          echo '  sed -i '\''/net.core.somaxconn/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "net.core.somaxconn=2048" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"
          echo '  sed -i '\''/net.ipv4.tcp_fastopen/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "net.ipv4.tcp_fastopen=3" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"

          # 内存脏页与 Swap 优化
          echo '  sed -i '\''/vm.swappiness/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "vm.swappiness=10" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"
          echo '  sed -i '\''/vm.dirty_ratio/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "vm.dirty_ratio=30" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"
          echo '  sed -i '\''/vm.dirty_background_ratio/d'\'' "$SYSCTL_CONF" || true' >> "$SETTINGS_SH"
          echo '  echo "vm.dirty_background_ratio=10" >> "$SYSCTL_CONF"' >> "$SETTINGS_SH"

          # 2. 优化 Conntrack 哈希桶大小（提升大并发查表速度）
          echo '  MODPROBE_CONF="files/etc/modprobe.d/nf_conntrack.conf"' >> "$SETTINGS_SH"
          echo '  mkdir -p "$(dirname "$MODPROBE_CONF")"' >> "$SETTINGS_SH"
          echo '  echo "options nf_conntrack hashsize=16384" > "$MODPROBE_CONF"' >> "$SETTINGS_SH"
          
          # 3. 开启 BBR 算法支持
          echo '  echo "CONFIG_PACKAGE_kmod-tcp-bbr=y" >> ./.config' >> "$SETTINGS_SH"
          
          # 4. 强制日志只写内存 (/tmp/system.log)，上限 64KB
          echo '  CFG_GEN="./package/base-files/files/bin/config_generate"' >> "$SETTINGS_SH"
          echo '  if [ -f "$CFG_GEN" ]; then' >> "$SETTINGS_SH"
          echo '    sed -i '\''/set system.@system\[-1\].log_file/d'\'' "$CFG_GEN" || true' >> "$SETTINGS_SH"
          echo '    sed -i '\''/set system.@system\[-1\].log_size/d'\'' "$CFG_GEN" || true' >> "$SETTINGS_SH"
          echo '    sed -i '\''/generate_system()/a \        set system.@system[-1].log_file=/tmp/system.log\n        set system.@system[-1].log_size=64'\'' "$CFG_GEN"' >> "$SETTINGS_SH"
          echo '  fi' >> "$SETTINGS_SH"

          echo '  echo "✅ IPQ60XX (1GB RAM) 参数与闪存保护注入完成！"' >> "$SETTINGS_SH"
          echo 'fi' >> "$SETTINGS_SH"
        fi

        echo "✅ Settings.sh 1GB RAM & Syslog RAM Patching Complete."
        
    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
