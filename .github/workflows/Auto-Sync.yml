name: Auto Sync Upstream & Workflow Mod

on:
  schedule:
    # 每天北京时间早上 04:30 自动运行（UTC 20:30）
    - cron: '30 20 * * *'
  workflow_dispatch: # 保留手动触发按钮

permissions: write-all

jobs:
  sync_and_modify:
    runs-on: ubuntu-latest
    name: Automated Sync and Strict Workflow Trimming

    steps:
    # 1. 使用 PAT_TOKEN 检出仓库
    - name: Checkout target repo with PAT
      uses: actions/checkout@v4
      with:
        ref: main
        token: ${{ secrets.PAT_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    # 2. 用原生 Git 执行上游 Sync Fork 合并动作
    - name: Fetch and Merge Upstream
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git remote add upstream https://github.com/VIKINGYFY/OpenWRT-CI.git
        git fetch upstream main
        
        git merge upstream/main --allow-unrelated-histories -m "🔄 Auto Sync: Fetch latest upstream" || echo "No remote changes to merge"

    # 3. 【仅编译】指定配置 & 注入 IPQ60XX 专属 Private 配置文件与 Handles.sh 魔改
    - name: Force Modify Downloaded Workflows
      run: |
        # ① 注释掉 MTK-ALL.yml 的自动触发
        if [ -f ".github/workflows/MTK-ALL.yml" ]; then
          sed -i '/workflow_run:/,/completed/ {s/^/#/}' .github/workflows/MTK-ALL.yml
          echo "🚫 Disabled auto-trigger for MTK-ALL.yml"
        fi

        # ② 精简 OWRT-ALL.yml 矩阵，只保留 X86 (完全不影响 X86 的默认配置)
        if [ -f ".github/workflows/OWRT-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[X86\]|g' .github/workflows/OWRT-ALL.yml
          echo "🎯 Constrained OWRT-ALL.yml matrix to X86 only"
        fi

        # ③ 修改 QCA-ALL.yml，只留 IPQ60XX 并挂载 Private-60xx.txt
        if [ -f ".github/workflows/QCA-ALL.yml" ]; then
          sed -i 's|CONFIG: \[.*\]|CONFIG: \[IPQ60XX-WIFI-NO\]|g' .github/workflows/QCA-ALL.yml
          
          # 在 WRT_CONFIG 下方动态插入 WRT_PRIVATE 参数
          if ! grep -q "WRT_PRIVATE:" .github/workflows/QCA-ALL.yml; then
            sed -i '/WRT_CONFIG:/a \      WRT_PRIVATE: '\''Private-60xx.txt'\''' .github/workflows/QCA-ALL.yml
          fi
          echo "🎯 Linked Private-60xx.txt to QCA-ALL.yml"
        fi

        # ④ 生成 IPQ60XX 专属补丁文件 Config/Private-60xx.txt
        TARGET_FILE="Config/Private-60xx.txt"
        MARKER="# --- EXCLUSIVE OVERRIDE FOR IPQ60XX ---"

        DISABLE_PKGS=(
          "dockerd" "docker" "containerd" "docker-compose"
          "luci-app-dockerman" "luci-lib-docker"
          "luci-app-samba4" "samba4-server" "samba4-libs"
          "ksmbd" "luci-app-ksmbd" "python3"
        )

        ENABLE_PKGS=(
          "conntrack" "dig" "tcpdump" "tree" "bash" "curl" "ip-full"
          "ddns-scripts-services" "ddns-scripts" "luci-app-ddns"
          "luci-app-timecontrol" "luci-app-cpufreq" "ttyd" "luci-app-ttyd"
          "luci-i18n-ttyd-zh-cn" "kmod-nft-tproxy" "ca-bundle"
        )

        mkdir -p Config
        [ ! -f "$TARGET_FILE" ] && touch "$TARGET_FILE"

        if ! grep -q "$MARKER" "$TARGET_FILE"; then
          echo "🛡️ 生成 $TARGET_FILE 专属裁剪补丁..."
          {
            echo ""
            echo "$MARKER"
            echo "# 仅针对 IPQ60XX 进行局部的压制剔除"
          } >> "$TARGET_FILE"

          for pkg in "${DISABLE_PKGS[@]}"; do
            echo "CONFIG_PACKAGE_${pkg}=n" >> "$TARGET_FILE"
            echo "# CONFIG_PACKAGE_${pkg} is not set" >> "$TARGET_FILE"
          done

          echo "# 额外增补的组件" >> "$TARGET_FILE"

          for pkg in "${ENABLE_PKGS[@]}"; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> "$TARGET_FILE"
          done
          echo "✅ $TARGET_FILE 写入完成！"
        fi

        # ⑤ 替换 Handles.sh 里的面板下载源，实现完全自动化的轻量面板预置
        if [ -f "Scripts/Handles.sh" ]; then
          sed -i 's|HP_DASHBOARD_SOURCE=.*|HP_DASHBOARD_SOURCE="https://codeload.github.com/MetaCubeX/Yacd-meta/zip/refs/heads/gh-pages"|g' Scripts/Handles.sh
          echo "⚡ Swapped HomeProxy dashboard source to Yacd-meta in Scripts/Handles.sh"
        fi

    # 4. 使用 PAT 安全地把合并和魔改后的代码一同 Push 回仓库
    - name: Push Synced & Modified Changes
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "✨ 检测到代码有更新或魔改差异，正在推送到你的 main 分支..."
          git add .
          git commit -m "⚙️ Auto Sync: Workflows successfully trimmed via PAT"
          git push origin main
          echo "✅ 自动同步与工作流裁剪大功告成！"
        else
          echo "🛑 分支状态无变动，已经是最新状态。"
        fi
